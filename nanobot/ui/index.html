<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐈 nanobot</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/core.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }

  /* ── Auth Modal ── */
  #auth-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
  }
  #auth-overlay.hidden { display: none; }
  #auth-box {
    background: #fff; border-radius: 14px; padding: 32px 36px;
    width: 320px; box-shadow: 0 8px 40px rgba(0,0,0,.3);
    display: flex; flex-direction: column; gap: 16px;
  }
  #auth-box h2 { font-size: 1.2rem; color: #1a1a2e; text-align: center; }
  #auth-box p { font-size: 0.85rem; color: #666; text-align: center; }
  #auth-password {
    border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px;
    font-size: 0.95rem; outline: none; width: 100%;
  }
  #auth-password:focus { border-color: #5c5cff; }
  #auth-submit {
    background: #5c5cff; color: #fff; border: none; border-radius: 8px;
    padding: 10px; font-size: 0.95rem; cursor: pointer; width: 100%;
  }
  #auth-submit:hover { background: #4444dd; }
  #auth-error { color: #c0392b; font-size: 0.82rem; text-align: center; min-height: 18px; }

  /* ── File Content Modal ── */
  #file-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 900;
  }
  #file-modal-overlay.hidden { display: none; }
  #file-modal {
    background: #fff; border-radius: 12px; width: 80vw; max-width: 860px;
    max-height: 80vh; display: flex; flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,.25);
  }
  #file-modal-header {
    padding: 12px 16px; border-bottom: 1px solid #eee;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #file-modal-title { font-size: 0.9rem; font-weight: 600; color: #333;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #file-modal-close {
    background: none; border: none; font-size: 1.3rem; cursor: pointer;
    color: #888; padding: 0 4px;
  }
  #file-modal-close:hover { color: #333; }
  #file-modal-body {
    flex: 1; overflow: auto; padding: 16px;
  }
  #file-modal-body pre {
    font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.82rem;
    white-space: pre-wrap; word-break: break-all; line-height: 1.5;
    color: #333;
  }

  /* ── Header ── */
  header {
    background: #1a1a2e; color: #fff; padding: 10px 16px;
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); z-index: 10;
  }
  header h1 { font-size: 1.1rem; white-space: nowrap; }
  .header-spacer { flex: 1; }
  #session-input {
    background: #2a2a4e; border: 1px solid #4a4a8e; color: #ccc;
    border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; width: 140px;
  }
  #session-input:focus { outline: none; border-color: #7c7cff; }
  .btn {
    background: #5c5cff; color: #fff; border: none; border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
  }
  .btn:hover { background: #4444dd; }
  .btn.danger { background: #c0392b; }
  .btn.danger:hover { background: #a93226; }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #e74c3c; flex-shrink: 0;
  }
  #status-dot.connected { background: #27ae60; }

  /* ── Main layout: sidebar + chat ── */
  #main {
    flex: 1; display: flex; overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 240px; min-width: 240px; background: #1e1e3a; color: #ccc;
    display: flex; flex-direction: column; flex-shrink: 0;
    border-right: 1px solid #2a2a4e; overflow: hidden;
    transition: margin-left 0.25s ease;
  }
  #sidebar.collapsed {
    margin-left: -240px;
  }

  /* ── Sidebar Tabs ── */
  #sidebar-tabs {
    display: flex; border-bottom: 1px solid #2a2a4e; flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; background: none; border: none; color: #888;
    padding: 10px 0; font-size: 0.82rem; cursor: pointer;
    border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
  }
  .tab-btn:hover { color: #ccc; }
  .tab-btn.active { color: #5c5cff; border-bottom-color: #5c5cff; }

  /* ── Sessions Panel ── */
  #panel-sessions {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 10px 14px; font-size: 0.85rem; font-weight: 600;
    color: #aaa; border-bottom: 1px solid #2a2a4e;
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  #sidebar-header button {
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 1rem; padding: 2px 6px; border-radius: 4px;
  }
  #sidebar-header button:hover { background: #2a2a4e; color: #fff; }
  #session-list {
    flex: 1; overflow-y: auto; padding: 6px 0;
  }
  .session-item {
    padding: 8px 14px; cursor: pointer; font-size: 0.82rem;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .session-item:hover { background: #2a2a4e; }
  .session-item.active { background: #3a3a6e; border-left: 3px solid #5c5cff; }
  .session-item-info {
    flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
  }
  .session-item .session-name {
    font-weight: 500; color: #e0e0e0; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .session-item .session-time {
    font-size: 0.72rem; color: #777;
  }
  .session-del-btn {
    background: none; border: none; color: #666; cursor: pointer;
    font-size: 0.85rem; padding: 2px 5px; border-radius: 4px;
    flex-shrink: 0; line-height: 1; opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .session-item:hover .session-del-btn { opacity: 1; }
  .session-del-btn:hover { color: #e74c3c; background: rgba(231,76,60,.15); }

  /* ── Files Panel ── */
  #panel-files {
    flex: 1; display: none; flex-direction: column; overflow: hidden;
  }
  #panel-files.active { display: flex; }
  #files-breadcrumb {
    padding: 8px 12px; font-size: 0.78rem; color: #aaa;
    border-bottom: 1px solid #2a2a4e; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #files-breadcrumb span {
    cursor: pointer; color: #7c7cff;
  }
  #files-breadcrumb span:hover { text-decoration: underline; }
  #files-list {
    flex: 1; overflow-y: auto; padding: 4px 0;
  }
  .file-item {
    padding: 7px 12px; cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; gap: 8px; color: #ccc;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s;
  }
  .file-item:hover { background: #2a2a4e; }
  .file-item .file-icon { flex-shrink: 0; font-size: 0.9rem; }
  .file-item .file-name {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-item .file-size { font-size: 0.7rem; color: #666; flex-shrink: 0; }

  /* ── Sidebar toggle ── */
  #toggle-sidebar {
    background: none; border: none; color: #aaa; cursor: pointer;
    font-size: 1.1rem; padding: 0 6px; display: flex; align-items: center;
  }
  #toggle-sidebar:hover { color: #fff; }

  /* ── Chat area ── */
  #chat-wrapper {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }

  /* ── Message bubbles ── */
  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg.bot  { align-self: flex-start; }
  .msg.push { align-self: center; max-width: 96%; }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; background: #ddd;
  }
  .msg.user .avatar { background: #5c5cff; }
  .msg.bot  .avatar { background: #e8e8e8; }
  .msg.push .avatar { background: #f39c12; }

  .bubble {
    padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 0.9rem; word-break: break-word;
  }
  .msg.user .bubble {
    background: #5c5cff; color: #fff; border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: #fff; color: #222; border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .msg.push .bubble {
    background: #fff3cd; color: #856404; border-radius: 10px;
    border: 1px solid #ffc107; font-size: 0.85rem; width: 100%;
  }

  /* ── Markdown inside bubbles ── */
  .bubble pre { background: #f6f8fa; border-radius: 6px; padding: 10px;
                overflow-x: auto; margin: 6px 0; }
  .bubble code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 0.85em; }
  .bubble p { margin-bottom: 6px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { padding-left: 18px; margin-bottom: 6px; }
  .bubble h1,.bubble h2,.bubble h3 { margin: 8px 0 4px; }
  .msg.user .bubble pre { background: #4444cc; }
  .msg.user .bubble code { color: #ffe; }

  /* ── Collapsible steps ── */
  .steps-group {
    align-self: flex-start; max-width: 92%; margin: 2px 0;
  }
  .steps-toggle {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    cursor: pointer; user-select: none;
    font-size: 0.78rem; color: #888; padding: 5px 10px;
    background: #f0f0f0; border-radius: 10px; border: none;
    transition: background 0.15s; text-align: left; width: 100%;
  }
  .steps-toggle:hover { background: #e8e8e8; }
  .steps-toggle .arrow {
    display: inline-block; transition: transform 0.2s;
    font-size: 0.65rem; flex-shrink: 0;
  }
  .steps-group.collapsed .arrow { transform: rotate(-90deg); }
  .steps-group:not(.collapsed) .arrow { transform: rotate(0deg); }
  .steps-toggle .step-summary { flex-shrink: 0; }
  .steps-toggle .tool-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .tool-chip {
    font-size: 0.7rem; padding: 1px 7px; border-radius: 8px;
    background: #dde; color: #4444bb; font-family: monospace;
    border: 1px solid #cce; white-space: nowrap;
  }
  .skill-chip {
    font-size: 0.7rem; padding: 1px 7px; border-radius: 8px;
    background: #e8f5e9; color: #2e7d32; font-family: monospace;
    border: 1px solid #c8e6c9; white-space: nowrap;
  }
  .steps-group.running .steps-toggle { background: #eef3ff; color: #666; }
  .steps-content {
    margin-top: 4px; padding: 0;
    overflow: hidden; transition: max-height 0.3s ease;
  }
  .steps-group.collapsed .steps-content {
    max-height: 0 !important;
  }
  .steps-content .step-item {
    font-size: 0.78rem; padding: 4px 10px; margin: 2px 0;
    border-radius: 10px; word-break: break-word; white-space: pre-wrap;
  }
  .step-item.progress { color: #777; background: #f5f5f5; }
  .step-item.tool {
    color: #3030aa; background: #eef; font-family: monospace;
    border-left: 3px solid #5c5cff; border-radius: 0 10px 10px 0; padding-left: 8px;
  }

  /* ── Typing indicator ── */
  .typing {
    align-self: flex-start; display: flex; gap: 5px; padding: 10px 14px;
    background: #fff; border-radius: 14px; border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .typing span {
    width: 7px; height: 7px; background: #999; border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,60%,100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* ── Input bar ── */
  #input-bar {
    background: #fff; border-top: 1px solid #e0e0e0;
    padding: 10px 14px; display: flex; gap: 8px; flex-shrink: 0;
  }
  #msg-input {
    flex: 1; border: 1px solid #ddd; border-radius: 20px;
    padding: 8px 16px; font-size: 0.9rem; resize: none; outline: none;
    max-height: 120px; overflow-y: auto; line-height: 1.4;
    font-family: inherit;
  }
  #msg-input:focus { border-color: #5c5cff; }
  #send-btn {
    background: #5c5cff; color: #fff; border: none; border-radius: 20px;
    padding: 8px 18px; cursor: pointer; font-size: 0.9rem; align-self: flex-end;
  }
  #send-btn:hover { background: #4444dd; }
  #send-btn:disabled { background: #aaa; cursor: default; }

  /* ── History divider ── */
  .history-divider {
    align-self: center; font-size: 0.75rem; color: #aaa;
    padding: 4px 16px; background: #eee; border-radius: 10px;
    margin: 4px 0;
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    #sidebar { position: absolute; top: 0; left: 0; bottom: 0; z-index: 20; }
    #sidebar.collapsed { margin-left: -240px; }
  }
</style>
</head>
<body>

<!-- Auth Modal -->
<div id="auth-overlay" class="hidden">
  <div id="auth-box">
    <h2>🐈 nanobot</h2>
    <p>请输入访问密码</p>
    <input id="auth-password" type="password" placeholder="密码" autocomplete="current-password">
    <div id="auth-error"></div>
    <button id="auth-submit" onclick="submitAuth()">进入</button>
  </div>
</div>

<!-- File Content Modal -->
<div id="file-modal-overlay" class="hidden">
  <div id="file-modal">
    <div id="file-modal-header">
      <span id="file-modal-title"></span>
      <button id="file-modal-close" onclick="closeFileModal()">✕</button>
    </div>
    <div id="file-modal-body"><pre id="file-modal-content"></pre></div>
  </div>
</div>

<!-- Header -->
<header>
  <button id="toggle-sidebar" onclick="toggleSidebar()" title="切换侧边栏">☰</button>
  <div id="status-dot" title="WebSocket 状态"></div>
  <h1>🐈 nanobot</h1>
  <div class="header-spacer"></div>
  <input id="session-input" type="text" value="default" placeholder="新会话 ID" title="输入新会话 ID">
  <button class="btn" onclick="createAndSwitch()">新建会话</button>
  <button class="btn" onclick="triggerHeartbeat()" title="立即触发一次心跳（测试用）">⚡ 心跳</button>
  <button class="btn danger" onclick="clearSession()">清除</button>
</header>

<div id="main">
  <!-- Sidebar -->
  <div id="sidebar">
    <!-- Tabs -->
    <div id="sidebar-tabs">
      <button class="tab-btn active" onclick="switchTab('sessions')">会话</button>
      <button class="tab-btn" onclick="switchTab('files')">文件</button>
    </div>

    <!-- Sessions Panel -->
    <div id="panel-sessions">
      <div id="sidebar-header">
        <span>会话列表</span>
        <button onclick="loadSessionList()" title="刷新">↻</button>
      </div>
      <div id="session-list"></div>
    </div>

    <!-- Files Panel -->
    <div id="panel-files">
      <div id="files-breadcrumb"></div>
      <div id="files-list"></div>
    </div>
  </div>

  <!-- Chat area -->
  <div id="chat-wrapper">
    <div id="chat"></div>
    <div id="input-bar">
      <textarea id="msg-input" rows="1" placeholder="输入消息，Shift+Enter 换行，Enter 发送…"></textarea>
      <button id="send-btn" onclick="sendMessage()">发送</button>
    </div>
  </div>
</div>

<script>
marked.setOptions({ breaks: true, gfm: true });

let ws = null;
let busy = false;
let typingEl = null;
let currentSessionId = 'default';
let authToken = sessionStorage.getItem('nanobotToken') || '';

// Steps tracking
let currentStepsGroup = null;
let stepsCounter = 0;
let toolsUsed = [];
let skillsUsed = [];

// File browser state
let currentFilePath = '';

const chat        = document.getElementById('chat');
const input       = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const dot         = document.getElementById('status-dot');
const sessInput   = document.getElementById('session-input');
const sidebar     = document.getElementById('sidebar');
const sessionList = document.getElementById('session-list');

// ── Auth helpers ─────────────────────────────────────────────────────────
function apiFetch(url, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (authToken) headers['X-Token'] = authToken;
  return fetch(url, { ...options, headers });
}

function wsUrl(sid) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const base = `${proto}://${location.host}/v1/ws/${encodeURIComponent(sid)}`;
  return authToken ? `${base}?token=${encodeURIComponent(authToken)}` : base;
}

// ── Boot / Auth flow ─────────────────────────────────────────────────────
async function boot() {
  try {
    const res = await fetch('/v1/auth/required');
    const data = await res.json();
    if (!data.required) {
      // No password set — fetch a dummy token so all requests work uniformly
      const r = await fetch('/v1/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      const d = await r.json();
      authToken = d.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      init();
      return;
    }
    // Auth required — validate existing token first
    if (authToken) {
      const probe = await apiFetch('/v1/sessions');
      if (probe.ok) { init(); return; }
      // Token invalid or expired
      authToken = '';
      sessionStorage.removeItem('nanobotToken');
    }
    showAuthModal();
  } catch (e) {
    console.error('Boot error:', e);
    showAuthModal();
  }
}

function showAuthModal() {
  document.getElementById('auth-overlay').classList.remove('hidden');
  document.getElementById('auth-password').focus();
}

async function submitAuth() {
  const pw = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  try {
    const res = await fetch('/v1/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (res.ok) {
      const data = await res.json();
      authToken = data.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      document.getElementById('auth-overlay').classList.add('hidden');
      init();
    } else {
      errEl.textContent = '密码错误，请重试';
      document.getElementById('auth-password').select();
    }
  } catch (e) {
    errEl.textContent = '请求失败，请检查网络';
  }
}

document.getElementById('auth-password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitAuth();
});

function init() {
  loadSessionList();
  loadHistory(currentSessionId).then(() => connect());
}

// ── Sidebar tabs ─────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', (i === 0 && tab === 'sessions') || (i === 1 && tab === 'files'));
  });
  const sessPanel = document.getElementById('panel-sessions');
  const filesPanel = document.getElementById('panel-files');
  if (tab === 'sessions') {
    sessPanel.style.display = 'flex';
    filesPanel.classList.remove('active');
  } else {
    sessPanel.style.display = 'none';
    filesPanel.classList.add('active');
    loadFiles(currentFilePath || '');
  }
}

function toggleSidebar() {
  sidebar.classList.toggle('collapsed');
}

// ── Session list ──────────────────────────────────────────────────────────
async function loadSessionList() {
  try {
    const res = await apiFetch('/v1/sessions');
    if (!res.ok) return;
    const data = await res.json();
    const sessions = (data.sessions || []).filter(s => s.key && s.key.startsWith('web:'));
    sessionList.innerHTML = '';

    if (sessions.length === 0) {
      sessionList.innerHTML = '<div style="padding:14px;color:#666;font-size:0.8rem;">暂无会话</div>';
      return;
    }

    sessions.forEach(s => {
      const sid = s.key.replace('web:', '');
      const el = document.createElement('div');
      el.className = 'session-item' + (sid === currentSessionId ? ' active' : '');

      const updatedAt = s.updated_at ? new Date(s.updated_at).toLocaleString('zh-CN') : '';
      el.innerHTML = `
        <div class="session-item-info" onclick="switchSession('${escapeHtml(sid)}')">
          <span class="session-name">${escapeHtml(sid)}</span>
          <span class="session-time">${updatedAt}</span>
        </div>
        <button class="session-del-btn" title="删除会话" onclick="deleteSession('${escapeHtml(sid)}', event)">✕</button>`;
      sessionList.appendChild(el);
    });
  } catch (e) {
    console.error('Failed to load sessions:', e);
  }
}

function switchSession(sid) {
  currentSessionId = sid;
  sessInput.value = sid;
  if (ws) ws.close();
  chat.innerHTML = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
  loadHistory(sid).then(() => connect());
  updateActiveSession();
}

function createAndSwitch() {
  const sid = sessInput.value.trim();
  if (!sid) return;
  switchSession(sid);
}

function updateActiveSession() {
  document.querySelectorAll('.session-item').forEach(el => {
    const nameEl = el.querySelector('.session-name');
    if (nameEl) el.classList.toggle('active', nameEl.textContent === currentSessionId);
  });
}

async function deleteSession(sid, e) {
  e.stopPropagation();
  await apiFetch(`/v1/sessions/web:${encodeURIComponent(sid)}`, { method: 'DELETE' });
  if (sid === currentSessionId) {
    // Switch to 'default' or any other remaining session
    switchSession('default');
  }
  loadSessionList();
}

// ── File browser ──────────────────────────────────────────────────────────
function formatSize(bytes) {
  if (bytes === null || bytes === undefined) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

async function loadFiles(path) {
  currentFilePath = path;
  const url = '/v1/files' + (path ? '?path=' + encodeURIComponent(path) : '');
  try {
    const res = await apiFetch(url);
    if (!res.ok) { renderFilesError('无法加载目录'); return; }
    const data = await res.json();
    if (data.type === 'file') {
      showFileModal(data.path || data.name, data.content || '');
      // Don't change current path since we opened a file
      return;
    }
    renderFilesList(data);
  } catch (e) {
    renderFilesError('请求失败');
  }
}

function renderBreadcrumb(path) {
  const bc = document.getElementById('files-breadcrumb');
  if (!path) {
    bc.innerHTML = '<span onclick="loadFiles(\'\')">workspace</span>';
    return;
  }
  const parts = path.split('/').filter(Boolean);
  let html = '<span onclick="loadFiles(\'\')">workspace</span>';
  let acc = '';
  parts.forEach((p, i) => {
    acc += (acc ? '/' : '') + p;
    const captured = acc;
    html += ` / <span onclick="loadFiles('${escapeHtml(captured)}')">${escapeHtml(p)}</span>`;
  });
  bc.innerHTML = html;
}

function renderFilesList(data) {
  renderBreadcrumb(data.path || '');
  const list = document.getElementById('files-list');
  list.innerHTML = '';

  // Back button if not at root
  if (data.path) {
    const parentPath = data.path.includes('/') ? data.path.substring(0, data.path.lastIndexOf('/')) : '';
    const back = document.createElement('div');
    back.className = 'file-item';
    back.innerHTML = '<span class="file-icon">↩</span><span class="file-name">..</span>';
    back.onclick = () => loadFiles(parentPath);
    list.appendChild(back);
  }

  const entries = data.entries || [];
  if (entries.length === 0) {
    list.innerHTML += '<div style="padding:12px;color:#666;font-size:0.78rem;">空目录</div>';
    return;
  }

  entries.forEach(entry => {
    const el = document.createElement('div');
    el.className = 'file-item';
    const icon = entry.type === 'dir' ? '📁' : '📄';
    const size = entry.type === 'file' ? formatSize(entry.size) : '';
    el.innerHTML = `<span class="file-icon">${icon}</span>
      <span class="file-name">${escapeHtml(entry.name)}</span>
      <span class="file-size">${size}</span>`;
    el.onclick = () => loadFiles(entry.path);
    list.appendChild(el);
  });
}

function renderFilesError(msg) {
  document.getElementById('files-list').innerHTML =
    `<div style="padding:12px;color:#e74c3c;font-size:0.78rem;">${escapeHtml(msg)}</div>`;
}

function showFileModal(title, content) {
  document.getElementById('file-modal-title').textContent = title;
  document.getElementById('file-modal-content').textContent = content;
  document.getElementById('file-modal-overlay').classList.remove('hidden');
}

function closeFileModal() {
  document.getElementById('file-modal-overlay').classList.add('hidden');
}

// Close file modal on overlay click
document.getElementById('file-modal-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('file-modal-overlay')) closeFileModal();
});

// ── History loading ────────────────────────────────────────────────────────
async function loadHistory(sid) {
  try {
    const res = await apiFetch(`/v1/sessions/web:${encodeURIComponent(sid)}/messages`);
    if (!res.ok) return;
    const data = await res.json();
    const messages = data.messages || [];
    if (messages.length === 0) return;

    const divider = document.createElement('div');
    divider.className = 'history-divider';
    divider.textContent = `── 历史记录 (${messages.length} 条) ──`;
    chat.appendChild(divider);

    messages.forEach(m => {
      if (m.role === 'user') appendUser(m.content, true);
      else if (m.role === 'assistant') appendBot(m.content, true);
    });

    const endDivider = document.createElement('div');
    endDivider.className = 'history-divider';
    endDivider.textContent = '── 历史记录结束 ──';
    chat.appendChild(endDivider);
    scrollBottom();
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

// ── WebSocket ─────────────────────────────────────────────────────────────
function connect() {
  const sid = currentSessionId;
  ws = new WebSocket(wsUrl(sid));

  ws.onopen = () => {
    dot.className = 'connected';
    appendSystem(`已连接到会话「${sid}」`);
    loadSessionList();
  };

  ws.onclose = () => {
    dot.className = '';
    appendSystem('连接断开，5 秒后重连…');
    setTimeout(connect, 5000);
  };

  ws.onerror = () => ws.close();

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'progress') {
      removeTyping();
      appendStep(msg.content, false);
    } else if (msg.type === 'tool') {
      removeTyping();
      appendStep(msg.content, true);
    } else if (msg.type === 'skill') {
      removeTyping();
      appendSkillUsed(msg.content);
    } else if (msg.type === 'message') {
      removeTyping();
      collapseCurrentSteps();
      appendBot(msg.content);
      setBusy(false);
      loadSessionList();
    } else if (msg.type === 'push') {
      removeTyping();
      collapseCurrentSteps();
      appendPush(msg.content);
      setBusy(false);
    }
  };
}

// ── Send ──────────────────────────────────────────────────────────────────
function sendMessage() {
  const text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  appendUser(text);
  ws.send(JSON.stringify({ content: text }));
  input.value = '';
  input.style.height = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
  showTyping();
  setBusy(true);
}

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', () => {
  input.style.height = '';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Session clear ─────────────────────────────────────────────────────────
async function clearSession() {
  const sid = currentSessionId;
  await apiFetch(`/v1/sessions/web:${encodeURIComponent(sid)}`, { method: 'DELETE' });
  chat.innerHTML = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  appendSystem(`会话「${sid}」已清除`);
  loadSessionList();
}

async function triggerHeartbeat() {
  try {
    appendSystem('⚡ 触发心跳中…');
    const res = await apiFetch('/v1/heartbeat/trigger', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      appendSystem(`心跳触发失败：${data.error}`);
    } else {
      appendSystem('心跳已触发，结果将以推送形式送达（若有任务）');
    }
  } catch (e) {
    appendSystem('心跳请求失败，请检查服务是否运行');
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function renderMarkdown(md) {
  return marked.parse(md || '');
}

function appendUser(text, isHistory) {
  const el = document.createElement('div');
  el.className = 'msg user';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML = `<div class="avatar">👤</div>
    <div class="bubble">${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
  chat.appendChild(el);
  if (!isHistory) scrollBottom();
}

function appendBot(text, isHistory) {
  const el = document.createElement('div');
  el.className = 'msg bot';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML = `<div class="avatar">🐈</div>
    <div class="bubble">${renderMarkdown(text)}</div>`;
  chat.appendChild(el);
  if (!isHistory) scrollBottom();
}

function appendPush(text) {
  const el = document.createElement('div');
  el.className = 'msg push';
  el.innerHTML = `<div class="avatar">🔔</div>
    <div class="bubble"><strong>系统通知</strong><br>${renderMarkdown(text)}</div>`;
  chat.appendChild(el);
  scrollBottom();
}

function appendSystem(text) {
  const el = document.createElement('div');
  el.className = 'history-divider';
  el.textContent = `ℹ️ ${text}`;
  chat.appendChild(el);
  scrollBottom();
}

// ── Collapsible steps ─────────────────────────────────────────────────────
function ensureStepsGroup() {
  if (currentStepsGroup) return currentStepsGroup;

  const group = document.createElement('div');
  group.className = 'steps-group running';

  const toggle = document.createElement('button');
  toggle.className = 'steps-toggle';
  toggle.innerHTML = `
    <span class="arrow">▼</span>
    <span class="step-summary">⏳ 思考中…</span>
    <span class="tool-chips"></span>`;
  toggle.onclick = () => group.classList.toggle('collapsed');

  const content = document.createElement('div');
  content.className = 'steps-content';

  group.appendChild(toggle);
  group.appendChild(content);
  chat.appendChild(group);
  currentStepsGroup = group;
  stepsCounter = 0;
  return group;
}

function extractToolName(text) {
  const m = text.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*[(\s"']?/);
  return m ? m[1] : text.split(/[\s("]/)[0];
}

function updateToggleChips(group) {
  const chipsEl = group.querySelector('.tool-chips');
  chipsEl.innerHTML = '';
  skillsUsed.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'skill-chip';
    chip.textContent = '✦ ' + name;
    chipsEl.appendChild(chip);
  });
  toolsUsed.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'tool-chip';
    chip.textContent = name;
    chipsEl.appendChild(chip);
  });
}

function appendSkillUsed(skillName) {
  if (!skillsUsed.includes(skillName)) skillsUsed.push(skillName);
  const group = ensureStepsGroup();
  updateToggleChips(group);
}

function appendStep(text, isTool) {
  const group = ensureStepsGroup();
  const content = group.querySelector('.steps-content');

  const el = document.createElement('div');
  el.className = 'step-item ' + (isTool ? 'tool' : 'progress');
  el.textContent = isTool ? `⚙️ ${text}` : `💭 ${text.slice(0, 400)}`;
  content.appendChild(el);
  stepsCounter++;

  if (isTool) {
    const toolName = extractToolName(text);
    if (toolName && !toolsUsed.includes(toolName)) toolsUsed.push(toolName);
    updateToggleChips(group);
  }

  const summary = group.querySelector('.step-summary');
  summary.textContent = `⏳ 思考中… (${stepsCounter} 步)`;
  content.style.maxHeight = content.scrollHeight + 40 + 'px';
  scrollBottom();
}

function finalizeCurrentSteps() {
  if (!currentStepsGroup) return;
  const group = currentStepsGroup;
  group.classList.remove('running');

  const summary = group.querySelector('.step-summary');
  const parts = [];
  if (skillsUsed.length) parts.push(`${skillsUsed.length} 个技能`);
  if (toolsUsed.length) parts.push(`${toolsUsed.length} 个工具`);
  const toolLabel = parts.length ? `使用了 ${parts.join(' · ')}` : '纯推理';
  summary.textContent = `✅ 完成 · ${stepsCounter} 步 · ${toolLabel}`;

  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
}

function collapseCurrentSteps() {
  finalizeCurrentSteps();
}

function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(typingEl);
  scrollBottom();
}

function removeTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function escapeHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Start ─────────────────────────────────────────────────────────────────
boot();
</script>
