<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>perrobot 🐕</title>
<!-- Locally vendored libraries (no external CDN — works offline / behind firewall) -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<link rel="stylesheet" href="/vendor/github.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;            /* page / inset surfaces */
  --surface: #ffffff;       /* cards, bubbles, inputs */
  --sidebar: #f6f6f8;       /* light gray sidebar */
  --hover: #ececf0;         /* hover row bg */
  --active: #e4e4ec;        /* active row bg */
  --border: #ececef;        /* hairline borders */
  --border-soft: #f1f1f4;   /* very subtle row dividers */
  --text: #1f2024;          /* primary text */
  --text-dim: #6b6b76;      /* secondary text */
  --text-faint: #9a9aa6;    /* tertiary / metadata */
  --accent: #5c5cff;        /* indigo-violet accent */
  --accent-hover: #4444dd;
  --accent-soft: #eeeeff;   /* accent-tinted bg */
  --success: #27ae60;
  --danger: #e74c3c;
  --code-bg: #f6f8fa;       /* light code block bg */
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased;
}

/* ── Auth Modal ── */
#auth-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
#auth-overlay.hidden { display: none; }
#auth-box {
  background: #fff; border-radius: 14px; padding: 32px 36px;
  width: 320px; box-shadow: 0 8px 40px rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 16px;
}
#auth-box h2 { font-size: 1.2rem; color: var(--text); text-align: center; }
#auth-box p { font-size: 0.85rem; color: #666; text-align: center; }
#auth-password {
  border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px;
  font-size: 0.95rem; outline: none; width: 100%;
}
#auth-password:focus { border-color: #5c5cff; }
#auth-submit {
  background: #5c5cff; color: #fff; border: none; border-radius: 8px;
  padding: 10px; font-size: 0.95rem; cursor: pointer; width: 100%;
}
#auth-submit:hover { background: #4444dd; }
#auth-error { color: #c0392b; font-size: 0.82rem; text-align: center; min-height: 18px; }

/* ── Header ── */
header {
  background: var(--surface); color: var(--text); padding: 10px 16px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  border-bottom: 1px solid var(--border); z-index: 10;
}
header h1 { font-size: 1.1rem; white-space: nowrap; font-weight: 650; }
.header-spacer { flex: 1; }
#model-select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer;
  max-width: 130px;
}
#model-select:focus { outline: none; border-color: var(--accent); }
#session-input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; width: 140px;
}
#session-input:focus { outline: none; border-color: var(--accent); }
.btn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
}
.btn:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); }
.btn.danger:hover { background: #a93226; }
.btn.secondary { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
.btn.secondary:hover { background: var(--hover); }
#status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); flex-shrink: 0;
}
#status-dot.connected { background: var(--success); }
#toggle-sidebar {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1.1rem; padding: 0 6px; display: flex; align-items: center;
}
#toggle-sidebar:hover { color: var(--text); }

/* ── Main layout ── */
#main {
  flex: 1; display: flex; overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: 240px; min-width: 160px; max-width: 480px;
  background: var(--sidebar); color: var(--text);
  display: flex; flex-direction: column; flex-shrink: 0;
  border-right: 1px solid var(--border); overflow: hidden;
}
#sidebar.collapsed { display: none; }

/* ── Resizers (drag to resize panels) ── */
.resizer {
  width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent;
  position: relative; z-index: 5; transition: background 0.15s;
}
.resizer:hover, .resizer.dragging { background: var(--accent); }
#resizer-right { display: none; }
#sidebar.collapsed + #resizer-left { display: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe { pointer-events: none; }

/* ── Sidebar Tabs ── */
#sidebar-tabs {
  display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.tab-btn {
  flex: 1; background: none; border: none; color: var(--text-dim);
  padding: 10px 0; font-size: 0.78rem; cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Sidebar Panels (shared) ── */
.sidebar-panel {
  flex: 1; display: none; flex-direction: column; overflow: hidden;
}
.sidebar-panel.active { display: flex; }

/* ── Sessions Panel ── */
#sidebar-sessions-header {
  padding: 8px 14px; font-size: 0.82rem; font-weight: 600;
  color: var(--text-dim); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; gap: 6px;
}
#sidebar-sessions-header button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1rem; padding: 2px 6px; border-radius: 4px;
}
#sidebar-sessions-header button:hover { background: var(--hover); color: var(--text); }
#session-filter {
  flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font-size: 0.82rem; outline: none;
}
#session-filter:focus { border-color: var(--accent); }
#session-list {
  flex: 1; overflow-y: auto; padding: 4px 0;
}
.session-item {
  padding: 7px 14px; cursor: pointer; font-size: 0.82rem;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.session-item:hover { background: var(--hover); }
.session-item.active { background: var(--active); border-left: 3px solid var(--accent); }
.session-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.session-item .session-name {
  font-weight: 500; color: var(--text); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.session-item .session-time { font-size: 0.72rem; color: var(--text-faint); }
.session-item-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.session-item:hover .session-item-actions { opacity: 1; }
.session-action-btn {
  background: none; border: none; color: var(--text-faint); cursor: pointer;
  font-size: 0.75rem; padding: 2px 4px; border-radius: 3px; line-height: 1;
}
.session-action-btn:hover { color: var(--danger); background: rgba(231,76,60,.12); }
.session-action-btn.export:hover { color: var(--success); background: rgba(39,174,96,.12); }
.session-action-btn.share:hover { color: var(--accent); background: var(--accent-soft); }

/* ── Files Panel ── */
#files-toolbar {
  padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  display: flex; flex-direction: column; gap: 5px;
}
#files-path-bar {
  display: flex; align-items: center; gap: 5px;
}
#files-path-input {
  flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 3px 7px; font-size: 0.75rem; outline: none;
  font-family: monospace;
}
#files-path-input:focus { border-color: var(--accent); }
.files-toolbar-row {
  display: flex; align-items: center; gap: 6px; font-size: 0.73rem; color: var(--text-dim);
}
#files-hidden-toggle { cursor: pointer; accent-color: var(--accent); }
#files-new-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer; margin-left: auto;
}
#files-new-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-workspace-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer;
}
#files-workspace-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-upload-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer;
}
#files-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-breadcrumb {
  padding: 5px 10px; font-size: 0.73rem; color: var(--text-dim);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#files-breadcrumb span { cursor: pointer; color: var(--accent); }
#files-breadcrumb span:hover { text-decoration: underline; }
#files-list { flex: 1; overflow-y: auto; padding: 2px 0; }
.file-item {
  padding: 6px 10px; cursor: pointer; font-size: 0.79rem;
  display: flex; align-items: center; gap: 7px; color: var(--text);
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s;
}
.file-item:hover { background: var(--hover); }
.file-item .file-icon { flex-shrink: 0; font-size: 0.85rem; }
.file-item .file-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-item .file-size { font-size: 0.68rem; color: var(--text-faint); flex-shrink: 0; }

/* ── Skills Panel ── */
#skills-header {
  padding: 8px 14px; font-size: 0.82rem; font-weight: 600; color: var(--text-dim);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
#skills-header button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1rem; padding: 2px 6px; border-radius: 4px;
}
#skills-header button:hover { background: var(--hover); color: var(--text); }
#skills-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.skill-item {
  padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s;
}
.skill-item:hover { background: var(--hover); }
.skill-item-top { display: flex; align-items: center; gap: 7px; }
.skill-item-name { font-weight: 550; font-size: 0.83rem; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.skill-badge { font-size: 0.62rem; padding: 1px 6px; border-radius: 6px; flex-shrink: 0;
  font-weight: 600; letter-spacing: 0.02em; }
.skill-badge.workspace { background: var(--accent-soft); color: var(--accent); }
.skill-badge.builtin { background: var(--active); color: var(--text-dim); }
.skill-badge.always { background: #e7f7ef; color: #2e7d32; }
.skill-avail-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--success); }
.skill-avail-dot.unavailable { background: var(--text-faint); }
.skill-item-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px;
  line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }
.skill-item-req { font-size: 0.68rem; color: #c0392b; margin-top: 3px; }

/* ── Skill Editor Modal ── */
#skill-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
#skill-overlay.hidden { display: none; }
#skill-box {
  background: var(--surface); border-radius: 14px; width: min(760px, 92vw);
  height: min(80vh, 720px); box-shadow: 0 12px 50px rgba(0,0,0,.3);
  display: flex; flex-direction: column; overflow: hidden;
}
#skill-box-header {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#skill-box-title { font-weight: 650; font-size: 0.98rem; }
#skill-box-badge { font-size: 0.65rem; padding: 1px 7px; border-radius: 6px; }
#skill-box-close { background: none; border: none; cursor: pointer; color: var(--text-dim);
  font-size: 0.95rem; padding: 4px 8px; }
#skill-box-close:hover { color: var(--text); }
#skill-box-hint { padding: 8px 16px; font-size: 0.76rem; color: var(--text-dim);
  background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#skill-box-hint.hidden { display: none; }
#skill-box-body { flex: 1; display: flex; min-height: 0; }
#skill-file-pane {
  width: 190px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); background: var(--bg); overflow: hidden;
}
#skill-file-pane-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; font-size: 0.72rem; font-weight: 600; color: var(--text-dim);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#skill-newfile-btn {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 0.95rem; line-height: 1; padding: 0 4px; border-radius: 4px;
}
#skill-newfile-btn:hover { background: var(--hover); color: var(--text); }
#skill-file-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.skill-file-item {
  padding: 6px 12px; font-size: 0.77rem; cursor: pointer; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.skill-file-item:hover { background: var(--hover); color: var(--text); }
.skill-file-item.active { background: var(--active); color: var(--text); font-weight: 550; }
#skill-box-content {
  flex: 1; min-width: 0; border: none; outline: none; resize: none; padding: 14px 16px;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 0.82rem;
  line-height: 1.6; color: var(--text); background: var(--surface);
}
#skill-box-content:read-only { background: var(--bg); color: var(--text-dim); }
#skill-box-actions {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--border); flex-shrink: 0;
}

/* ── Chat Panel ── */
#chat-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  min-width: 0;
}
#chat {
  flex: 1; overflow-y: auto;
  padding: 24px max(16px, calc((100% - 820px) / 2));
  display: flex; flex-direction: column; gap: 16px;
}

/* ── Message bubbles ── */
.msg { display: flex; gap: 10px; max-width: 88%; }
.msg.user { flex-direction: row-reverse; align-self: flex-end; }
.msg.bot  { align-self: flex-start; }
.msg.push { align-self: center; max-width: 96%; }
.avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; background: var(--active);
}
.msg.user .avatar { background: var(--active); }
.msg.bot  .avatar { background: linear-gradient(135deg, #5c5cff, #7c5cff); }
.msg.push .avatar { background: #f39c12; }
.bubble {
  padding: 11px 15px; border-radius: 14px; line-height: 1.6;
  font-size: 0.9rem; word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent); color: #fff; border-top-right-radius: 4px;
}
.msg.bot .bubble {
  background: var(--surface); color: var(--text); border-top-left-radius: 4px;
  border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.msg.push .bubble {
  background: #fff8e6; color: #8a6d1a; border-radius: 10px;
  border: 1px solid #f0d480; font-size: 0.85rem; width: 100%;
}
.bubble pre { background: var(--code-bg); border: 1px solid var(--border);
              border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
.bubble code { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 0.85em; }
.bubble p > code, .bubble li > code { background: #f1f1f4; padding: 1.5px 5px; border-radius: 5px; }
.bubble p { margin-bottom: 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
.bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 5px; }
.msg.user .bubble pre { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.2); }
.msg.user .bubble p > code, .msg.user .bubble li > code { background: rgba(255,255,255,.18); color: #fff; }
.msg.user .bubble code { color: #fff; }
.msg.user .bubble a { color: #fff; text-decoration: underline; }
/* Live-streaming bubble: show raw text with a blinking caret */
.bubble.streaming { white-space: pre-wrap; }
.bubble.streaming::after {
  content: '▋'; color: var(--accent); margin-left: 1px;
  animation: caret-blink 1s steps(2, start) infinite;
}
@keyframes caret-blink { to { visibility: hidden; } }
/* Tables rendered from markdown (GFM) */
.bubble table { border-collapse: collapse; margin: 8px 0; font-size: 0.85em;
                display: block; overflow-x: auto; max-width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.bubble th { background: #f7f7fa; font-weight: 600; }
.bubble tr:nth-child(even) td { background: #fafafe; }
.bubble blockquote { border-left: 3px solid var(--border); padding-left: 12px;
                     color: var(--text-dim); margin: 6px 0; }
.bubble a { color: var(--accent); }
/* Mermaid diagrams */
.bubble .mermaid { background: #fbfbfe; border: 1px solid var(--border); border-radius: 8px;
                   padding: 10px; margin: 8px 0; text-align: center; overflow-x: auto; }
.bubble .mermaid svg { max-width: 100%; height: auto; }
.bubble .mermaid-error { background: #fff8e6; border: 1px solid #f0d480; color: #8a6d1a;
                         border-radius: 6px; padding: 8px 10px; margin: 8px 0;
                         font-size: 0.8rem; white-space: pre-wrap; }

/* ── Approval card ── */
.approval-card {
  align-self: center; width: 100%; max-width: 760px;
  background: #fff8e6; border: 1px solid #f0d480; border-radius: 12px;
  padding: 12px 14px; margin: 2px 0;
}
.approval-card.approved { background: #f0f9f2; border-color: #bfe3c9; }
.approval-card.denied { background: #fdeceb; border-color: #f3c4c0; }
.approval-head { font-weight: 650; font-size: 0.86rem; color: #8a6d1a; margin-bottom: 6px; }
.approval-card.approved .approval-head { color: #2e7d32; }
.approval-card.denied .approval-head { color: #c0392b; }
.approval-reason { font-size: 0.82rem; color: var(--text); margin-bottom: 8px; }
.approval-cmd {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem;
  white-space: pre-wrap; word-break: break-all; margin-bottom: 10px; color: var(--text);
}
.approval-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.approval-result { font-size: 0.82rem; font-weight: 600; }
.approval-result.ok { color: #2e7d32; }
.approval-result.no { color: #c0392b; }

/* ── Steps ── */
.steps-group { align-self: flex-start; max-width: 92%; margin: 2px 0; }
.steps-toggle {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  cursor: pointer; user-select: none; font-size: 0.78rem; color: var(--text-dim);
  padding: 7px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; transition: background 0.15s; text-align: left; width: 100%;
}
.steps-toggle:hover { background: var(--hover); }
.steps-toggle .arrow { display: inline-block; transition: transform 0.2s; font-size: 0.65rem; flex-shrink: 0; }
.steps-group.collapsed .arrow { transform: rotate(-90deg); }
.steps-group:not(.collapsed) .arrow { transform: rotate(0deg); }
.steps-toggle .step-summary { flex-shrink: 0; }
.steps-toggle .tool-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tool-chip {
  font-size: 0.7rem; padding: 1px 7px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent); font-family: monospace;
  white-space: nowrap;
}
.skill-chip {
  font-size: 0.7rem; padding: 1px 7px; border-radius: 7px;
  background: #e7f7ef; color: #2e7d32; font-family: monospace;
  white-space: nowrap;
}
.steps-group.running .steps-toggle { background: var(--accent-soft); color: var(--text-dim); }
.steps-content { margin-top: 4px; padding: 0; overflow: hidden; transition: max-height 0.3s ease; }
.steps-group.collapsed .steps-content { max-height: 0 !important; }
.steps-content .step-item {

/* ── Typing indicator ── */

.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ── Input bar ── */
#input-bar {
  background: var(--bg);
  padding: 12px max(16px, calc((100% - 820px) / 2)) 18px;
  display: flex; gap: 8px; flex-shrink: 0; align-items: flex-end;

#attach-btn {
  background: none; border: none; cursor: pointer; font-size: 1.15rem;
  align-self: flex-end; padding: 8px 4px; line-height: 1; opacity: 0.65;
}
#attach-btn:hover { opacity: 1; }
#attach-btn:disabled { opacity: 0.3; cursor: default; }

/* ── History divider ── */
.history-divider {
  align-self: center; font-size: 0.75rem; color: var(--text-faint);

/* ── Editor Panel ── */
#editor-panel {

<body>

<!-- Auth Modal -->
<div id="auth-overlay" class="hidden">
  <div id="auth-box">

<!-- Skill Editor Modal -->

<!-- Header -->
<header>
  <button id="toggle-sidebar" onclick="toggleSidebar()" title="切换侧边栏">☰</button>

  <h1>🐕 perrobot</h1>

<div id="main">
  <!-- Sidebar -->

    <!-- Tabs -->

          <button id="files-upload-btn" onclick="document.getElementById('files-upload-input').click()" title="上传文件到当前目录">⤓</button>

      <input id="chat-upload-input" type="file" multiple style="display:none" onchange="uploadChatAttachments(this.files)">
      <textarea id="msg-input" rows="1" placeholder="输入消息，Shift+Enter 换行，Enter 发送…"></textarea>

    </div>

<script>
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });
if (typeof mermaid !== 'undefined') {
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
}
let _mermaidSeq = 0;

// ── Global state ──────────────────────────────────────────────────────────
let ws = null;
let busy = false;
let typingEl = null;
let currentSessionId = 'default';
let authToken = sessionStorage.getItem('nanobotToken') || '';

// Steps tracking
let currentStepsGroup = null;
let stepsCounter = 0;
let toolsUsed = [];
let skillsUsed = [];

// Streaming state (live token-by-token bubble)
let streamBubbleEl = null;   // the live .bubble element
let streamBuffer = '';       // accumulated raw text

// File browser state
let currentFilePath = '';
let allSessions = [];

// Editor state
// Map<path, {content: string, originalContent: string, dirty: bool}>
const editorFiles = new Map();
let editorActiveTab = null; // path
let editorMode = 'view'; // 'view' | 'edit'

// DOM refs
const chat        = document.getElementById('chat');
const input       = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const dot         = document.getElementById('status-dot');
const sessInput   = document.getElementById('session-input');
const sidebar     = document.getElementById('sidebar');
const sessionList = document.getElementById('session-list');

// ── Panel resizing (drag handles) ──────────────────────────────────────────
function setupResizer(handleId, getEl, opts) {
  var handle = document.getElementById(handleId);
  if (!handle) return;
  handle.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var el = getEl();
    if (!el) return;
    var startX = e.clientX;
    var startW = el.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.classList.add('resizing');
    function onMove(ev) {
      // dir = +1 means panel grows when dragging right; -1 means grows when dragging left
      var delta = (ev.clientX - startX) * (opts.dir || 1);
      var w = Math.max(opts.min, Math.min(opts.max, startW + delta));
      el.style.width = w + 'px';
    }
    function onUp() {
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try { localStorage.setItem(opts.key, el.style.width); } catch (_) {}
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

setupResizer('resizer-left', function() { return sidebar; },
  { min: 160, max: 480, dir: 1, key: 'perrobot.sidebarW' });
setupResizer('resizer-right', function() { return document.getElementById('editor-panel'); },
  { min: 280, max: 1100, dir: -1, key: 'perrobot.editorW' });

// Restore saved widths
try {
  var sw = localStorage.getItem('perrobot.sidebarW');
  if (sw) sidebar.style.width = sw;
} catch (_) {}

// ── File type detection ─────────────────────────────────────────────────────
var CODE_LANGS = {
  py: 'python', js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
  sh: 'bash', bash: 'bash', json: 'json', css: 'css', scss: 'css',
  xml: 'xml', yaml: 'yaml', yml: 'yaml', java: 'java', go: 'go', rs: 'rust',
  c: 'c', cpp: 'cpp', h: 'cpp', rb: 'ruby', php: 'php', sql: 'sql', toml: 'ini', ini: 'ini'
};
var IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico'];

function fileKind(path) {
  var ext = (path.split('.').pop() || '').toLowerCase();
  if (ext === 'md' || ext === 'markdown') return 'md';
  if (ext === 'html' || ext === 'htm') return 'html';
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (IMAGE_EXTS.indexOf(ext) >= 0) return 'image';
  if (ext === 'doc' || ext === 'xls' || ext === 'xlsx' || ext === 'ppt' ||
      ext === 'pptx' || ext === 'zip' || ext === 'tar' || ext === 'gz' ||
      ext === 'exe' || ext === 'bin' || ext === 'so' || ext === 'dylib') return 'binary';
  return 'text';
}

// Editable kinds (can be loaded as text & saved)
function isEditableKind(kind) {
  return kind === 'text' || kind === 'md' || kind === 'html';
}

function downloadUrl(path) {
  var u = '/v1/files/download?path=' + encodeURIComponent(path);
  if (authToken) u += '&token=' + encodeURIComponent(authToken);
  return u;
}

// ── Auth helpers ───────────────────────────────────────────────────────────
function apiFetch(url, options) {
  options = options || {};
  var headers = Object.assign({}, options.headers || {});
  if (authToken) headers['X-Token'] = authToken;
  return fetch(url, Object.assign({}, options, { headers: headers }));
}

function wsUrl(sid) {
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var base = proto + '://' + location.host + '/v1/ws/' + encodeURIComponent(sid);
  return authToken ? base + '?token=' + encodeURIComponent(authToken) : base;
}

// ── Boot / Auth flow ───────────────────────────────────────────────────────
async function boot() {
  try {
    var res = await fetch('/v1/auth/required');
    var data = await res.json();
    if (!data.required) {
      var r = await fetch('/v1/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      var d = await r.json();
      authToken = d.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      init();
      return;
    }
    if (authToken) {
      var probe = await apiFetch('/v1/sessions');
      if (probe.ok) { init(); return; }
      authToken = '';
      sessionStorage.removeItem('nanobotToken');
    }
    showAuthModal();
  } catch (e) {
    console.error('Boot error:', e);
    showAuthModal();
  }
}

function showAuthModal() {
  document.getElementById('auth-overlay').classList.remove('hidden');
  document.getElementById('auth-password').focus();
}

async function submitAuth() {
  var pw = document.getElementById('auth-password').value;
  var errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  try {
    var res = await fetch('/v1/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (res.ok) {
      var data = await res.json();
      authToken = data.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      document.getElementById('auth-overlay').classList.add('hidden');
      init();
    } else {
      errEl.textContent = '密码错误，请重试';
      document.getElementById('auth-password').select();
    }
  } catch (e) {
    errEl.textContent = '请求失败，请检查网络';
  }
}

document.getElementById('auth-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitAuth();
});

function init() {
  loadSessionList();
  loadModels();
  loadHistory(currentSessionId).then(function() { connect(); });
}

// ── Model switching ────────────────────────────────────────────────────────
async function loadModels() {
  try {
    var res = await apiFetch('/v1/models');
    if (!res.ok) return;
    var data = await res.json();
    if (!data.models || !data.models.length) return;
    var sel = document.getElementById('model-select');
    sel.innerHTML = '';
    data.models.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label;
      if (m.id === data.current) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.style.display = '';
  } catch (_) {}
}

async function switchModel() {
  var sel = document.getElementById('model-select');
  var model = sel.value;
  if (!model) return;
  try {
    var res = await apiFetch('/v1/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model }),
    });
    if (res.ok) {
      appendSystem('模型已切换为：' + model);
    } else {
      appendSystem('模型切换失败');
      loadModels();
    }
  } catch (e) {
    appendSystem('模型切换失败：' + (e && e.message ? e.message : e));
    loadModels();
  }
}

function toggleSidebar() {

// ── Session list ───────────────────────────────────────────────────────────
async function loadSessionList() {
  try {
    var res = await apiFetch('/v1/sessions');
    if (!res.ok) return;
    var data = await res.json();
    allSessions = (data.sessions || []).filter(function(s) {
      return s.key && s.key.startsWith('web:');
    });
    renderSessionList(allSessions);
  } catch (e) {
    console.error('Failed to load sessions:', e);
  }
}

function filterSessions() {
  var q = document.getElementById('session-filter').value.toLowerCase();
  var filtered = q
    ? allSessions.filter(function(s) { return s.key.toLowerCase().includes(q); })
    : allSessions;
  renderSessionList(filtered);
}

function renderSessionList(sessions) {
  sessionList.innerHTML = '';
  if (sessions.length === 0) {
    sessionList.innerHTML = '<div style="padding:14px;color:#666;font-size:0.8rem;">暂无会话</div>';
    return;
  }
  sessions.forEach(function(s) {
    var sid = s.key.replace('web:', '');
    var el = document.createElement('div');
    el.className = 'session-item' + (sid === currentSessionId ? ' active' : '');
    var updatedAt = s.updated_at ? new Date(s.updated_at).toLocaleString('zh-CN') : '';
    el.innerHTML =
      '<div class="session-item-info" onclick="switchSession(\'' + escapeHtml(sid) + '\')">' +
        '<span class="session-name">' + escapeHtml(sid) + '</span>' +
        '<span class="session-time">' + updatedAt + '</span>' +
      '</div>' +
      '<div class="session-item-actions">' +
        '<button class="session-action-btn share" title="生成只读分享链接" onclick="shareSession(\'' + escapeHtml(sid) + '\', event)">🔗</button>' +
        '<button class="session-action-btn export" title="导出为 Markdown" onclick="exportSession(\'' + escapeHtml(sid) + '\', event)">↓</button>' +
        '<button class="session-action-btn" title="删除会话" onclick="deleteSession(\'' + escapeHtml(sid) + '\', event)">✕</button>' +
      '</div>';
    sessionList.appendChild(el);
  });
}

function switchSession(sid) {
  currentSessionId = sid;
  sessInput.value = sid;
  if (ws) ws.close();
  chat.innerHTML = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
  loadHistory(sid).then(function() { connect(); });
  updateActiveSession();
}

function createAndSwitch() {
  var sid = sessInput.value.trim();
  if (!sid) return;
  switchSession(sid);
}

function updateActiveSession() {
  document.querySelectorAll('.session-item').forEach(function(el) {
    var nameEl = el.querySelector('.session-name');
    if (nameEl) el.classList.toggle('active', nameEl.textContent === currentSessionId);
  });
}

async function deleteSession(sid, e) {
  e.stopPropagation();
  await apiFetch('/v1/sessions/web:' + encodeURIComponent(sid), { method: 'DELETE' });
  if (sid === currentSessionId) {
    switchSession('default');
  }
  loadSessionList();
}

async function shareSession(sid, e) {
  e.stopPropagation();
  try {
    var res = await apiFetch('/v1/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: 'web:' + sid }),
    });
    if (!res.ok) { alert('生成分享链接失败'); return; }
    var data = await res.json();
    var fullUrl = location.origin + data.url;
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(fullUrl);
        copied = true;
      }
    } catch (_) {}
    window.prompt(
      copied ? '只读分享链接已复制到剪贴板：' : '只读分享链接（手动复制）：',
      fullUrl
    );
  } catch (err) {
    alert('生成分享链接失败：' + (err && err.message ? err.message : err));
  }
}

async function exportSession(sid, e) {
  e.stopPropagation();
  var url = '/v1/sessions/web:' + encodeURIComponent(sid) + '/export?format=md';
  if (authToken) url += '&token=' + encodeURIComponent(authToken);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'session_' + sid + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── File browser ───────────────────────────────────────────────────────────
function formatSize(bytes) {
  if (bytes === null || bytes === undefined) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function goWorkspace() {
  loadFiles('');
}

async function loadFiles(path) {
  currentFilePath = path;
  // Update path input
  var pathInput = document.getElementById('files-path-input');
  pathInput.value = path || '';

  var showHidden = document.getElementById('files-hidden-toggle').checked;
  var url = '/v1/files' + (path ? '?path=' + encodeURIComponent(path) : '');
  try {
    var res = await apiFetch(url);
    if (!res.ok) { renderFilesError('无法加载目录'); return; }
    var data = await res.json();
    if (data.type === 'file') {
      var p = data.path || path;
      var nm = data.name || p.split('/').pop();
      var kind = fileKind(nm);
      if (isEditableKind(kind)) openFileInEditor(p, data.content || '', kind);
      else openFileInEditor(p, null, kind);
      return;
    }
    renderFilesList(data, showHidden);
  } catch (e) {
    renderFilesError('无法加载目录：' + e.message);
  }
}

// Open a file (type-aware): fetch text only for editable kinds.
async function openFile(path, name) {
  var kind = fileKind(name || path);
  if (!isEditableKind(kind)) {
    // Binary / preview-by-URL — no text fetch needed
    openFileInEditor(path, null, kind);
    return;
  }
  try {
    var res = await apiFetch('/v1/files?path=' + encodeURIComponent(path));
    if (!res.ok) { appendSystem('打开文件失败：' + path); return; }
    var data = await res.json();
    openFileInEditor(path, (data && data.content) || '', kind);
  } catch (e) {
    appendSystem('打开文件失败：' + e.message);
  }
}

function renderBreadcrumb(path) {
  var bc = document.getElementById('files-breadcrumb');
  if (!path || path === '') {
    bc.innerHTML = '<span onclick="loadFiles(\'\')">workspace</span>';
    return;
  }
  var parts = path.split('/').filter(Boolean);
  var html = '<span onclick="loadFiles(\'\')">workspace</span>';
  var acc = '';
  parts.forEach(function(p) {
    acc += (acc ? '/' : '') + p;
    var captured = acc;
    html += ' / <span onclick="loadFiles(\'' + escapeAttr(captured) + '\')">' + escapeHtml(p) + '</span>';
  });
  bc.innerHTML = html;
}

function renderFilesList(data, showHidden) {
  renderBreadcrumb(data.path || '');
  var list = document.getElementById('files-list');
  list.innerHTML = '';

  if (data.path) {
    var parentPath = data.path.includes('/') ? data.path.substring(0, data.path.lastIndexOf('/')) : '';
    var back = document.createElement('div');
    back.className = 'file-item';
    back.innerHTML = '<span class="file-icon">↩</span><span class="file-name">..</span>';
    back.onclick = function() { loadFiles(parentPath); };
    list.appendChild(back);
  }

  var entries = (data.entries || []).filter(function(e) {
    return showHidden || !e.name.startsWith('.');
  });

  if (entries.length === 0) {
    list.innerHTML += '<div style="padding:12px;color:#666;font-size:0.78rem;">空目录</div>';
    return;
  }

  entries.forEach(function(entry) {
    var el = document.createElement('div');
    el.className = 'file-item';
    var icon = entry.type === 'dir' ? '📁' : '📄';
    var size = entry.type === 'file' ? formatSize(entry.size) : '';
    el.innerHTML =
      '<span class="file-icon">' + icon + '</span>' +
      '<span class="file-name">' + escapeHtml(entry.name) + '</span>' +
      '<span class="file-size">' + size + '</span>';
    var entryPath = entry.path;
    var entryType = entry.type;
    var entryName = entry.name;
    el.onclick = function() {
      if (entryType === 'dir') loadFiles(entryPath);
      else openFile(entryPath, entryName);
    };
    list.appendChild(el);
  });
}

function renderFilesError(msg) {
  document.getElementById('files-list').innerHTML =
    '<div style="padding:12px;color:#e74c3c;font-size:0.78rem;">' + escapeHtml(msg) + '</div>';
}

// Handle path input Enter key
document.getElementById('files-path-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var path = e.target.value.trim();
    loadFiles(path);
  }
});

function newFile() {
  var name = prompt('新文件名（在当前目录下）：');
  if (!name) return;
  var path = currentFilePath ? currentFilePath + '/' + name : name;
  openFileInEditor(path, '');
}

// Upload one file to a target directory via the multipart endpoint.
// Returns the saved relative path, or null on failure.
async function uploadOneFile(file, targetDir) {
  var fd = new FormData();
  fd.append('file', file);
  fd.append('path', targetDir || '');
  // Note: don't set Content-Type — the browser sets the multipart boundary.
  var res = await apiFetch('/v1/files/upload', { method: 'POST', body: fd });
  if (!res.ok) return null;
  var data = await res.json();
  return data.path || null;
}

// Sidebar: upload selected files into the directory currently being browsed.
async function uploadFilesToCurrentDir(fileList) {
  var files = Array.from(fileList || []);
  if (!files.length) return;
  appendSystem('上传中… (' + files.length + ' 个文件)');
  var ok = 0;
  for (var i = 0; i < files.length; i++) {
    try {
      var saved = await uploadOneFile(files[i], currentFilePath || '');
      if (saved) ok++;
    } catch (_) {}
  }
  document.getElementById('files-upload-input').value = '';
  appendSystem('已上传 ' + ok + '/' + files.length + ' 个文件到 ' + (currentFilePath || 'workspace'));
  loadFiles(currentFilePath || '');
}

// Chat: upload attachments into uploads/, then reference their paths in the input
// so the agent knows where to read them.
async function uploadChatAttachments(fileList) {
  var files = Array.from(fileList || []);
  if (!files.length) return;
  var btn = document.getElementById('attach-btn');
  btn.disabled = true;
  var paths = [];
  for (var i = 0; i < files.length; i++) {
    try {
      var saved = await uploadOneFile(files[i], 'uploads');
      if (saved) paths.push(saved);
    } catch (_) {}
  }
  document.getElementById('chat-upload-input').value = '';
  btn.disabled = false;
  if (!paths.length) { appendSystem('附件上传失败'); return; }
  // Prepend a reference line to the message input.
  var ref = '附件：' + paths.join('、') + '\n';
  input.value = ref + input.value;
  input.focus();
  input.dispatchEvent(new Event('input'));
}

function renderSkills(skills) {

// The file currently shown in the editor (relative path within the skill).
let currentSkillFile = null;

async function openSkillEditor(name) {
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(name) + '/files');
    if (!res.ok) { alert('打开技能失败'); return; }
    var data = await res.json();
    currentSkill = { name: data.name, source: data.source, editable: data.editable,
                     persisted: true, files: data.files || [] };
    currentSkillFile = null;
    renderSkillChrome();
    document.getElementById('skill-overlay').classList.remove('hidden');
    var skillMd = currentSkill.files.filter(function(f){ return f.path === 'SKILL.md'; })[0];
    var pick = skillMd || currentSkill.files[0];
    if (pick) {
      await openSkillFile(pick.path);
    } else {
      setSkillContent('（空技能目录）', null, false);
    }
  } catch (e) {
    alert('打开技能失败：' + (e && e.message ? e.message : e));
  }
}

// Render the modal frame (title, badge, hint, file list, buttons) — not content.
function renderSkillChrome() {
  var s = currentSkill;
  document.getElementById('skill-box-title').textContent = s.name;
  var badge = document.getElementById('skill-box-badge');
  badge.textContent = s.source === 'workspace' ? '自定义' : '内置';
  badge.className = s.source === 'workspace' ? 'skill-badge workspace' : 'skill-badge builtin';

  var hint = document.getElementById('skill-box-hint');
  if (!s.editable) {
    hint.textContent = '内置技能为只读。点击「复制到 workspace」生成可编辑的自定义副本（含全部子文件，会覆盖同名内置技能）。';
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
  document.getElementById('skill-copy-btn').style.display = s.editable ? 'none' : '';
  document.getElementById('skill-delete-btn').style.display =
    (s.editable && s.source === 'workspace' && s.persisted) ? '' : 'none';
  document.getElementById('skill-newfile-btn').style.display =
    (s.editable && s.persisted) ? '' : 'none';
  renderSkillFileList();
}

function renderSkillFileList() {
  var list = document.getElementById('skill-file-list');
  list.innerHTML = '';
  currentSkill.files.forEach(function(f) {
    var el = document.createElement('div');
    el.className = 'skill-file-item' + (f.path === currentSkillFile ? ' active' : '');
    el.textContent = f.path;
    el.title = f.path;
    var p = f.path;
    el.onclick = function() { openSkillFile(p); };
    list.appendChild(el);
  });
}

// Load text into the editor and reconcile the file highlight + save button.
function setSkillContent(text, path, editable) {
  var ta = document.getElementById('skill-box-content');
  ta.value = text;
  ta.readOnly = !editable;
  currentSkillFile = path;
  document.getElementById('skill-save-btn').style.display = editable ? '' : 'none';
  renderSkillFileList();
}

async function openSkillFile(path) {
  try {
    var url = '/v1/skills/' + encodeURIComponent(currentSkill.name) +
              '/file?path=' + encodeURIComponent(path);
    var res = await apiFetch(url);
    if (!res.ok) { alert('打开文件失败'); return; }
    var data = await res.json();
    if (data.binary) {
      setSkillContent('（二进制文件，无法在此预览：' + path + '）', path, false);
    } else {
      setSkillContent(data.content || '', path, currentSkill.editable);
    }
  } catch (e) {
    alert('打开文件失败：' + (e && e.message ? e.message : e));
  }
}

function closeSkillEditor() {
  document.getElementById('skill-overlay').classList.add('hidden');
  currentSkill = { name: null, source: null, editable: false, persisted: false, files: [] };
  currentSkillFile = null;
}

function newSkill() {
  var name = prompt('新技能名称（字母/数字/-/_，将作为目录名）：');
  if (!name) return;
  if (!/^[a-zA-Z0-9_-]+$/.test(name)) { alert('名称只能包含字母、数字、连字符和下划线'); return; }
  currentSkill = { name: name, source: 'workspace', editable: true,
                   persisted: false, files: [{ path: 'SKILL.md' }] };
  var tpl =
    '---\n' +
    'name: ' + name + '\n' +
    'description: "一句话描述这个技能的用途和触发场景"\n' +
    '---\n\n' +
    '# ' + name + '\n\n' +
    '在这里写下 agent 使用该技能的指引。\n';
  renderSkillChrome();
  setSkillContent(tpl, 'SKILL.md', true);
  document.getElementById('skill-overlay').classList.remove('hidden');
}

// Add a new sub-file to a persisted workspace skill (e.g. scripts/run.sh).
async function newSkillFile() {
  if (!currentSkill.persisted) { alert('请先保存技能后再添加文件'); return; }
  var path = prompt('新文件相对路径（如 scripts/run.sh）：');
  if (!path) return;
  if (path.charAt(0) === '/' || path.indexOf('..') !== -1) { alert('路径不合法'); return; }
  if (currentSkill.files.some(function(f){ return f.path === path; })) { openSkillFile(path); return; }
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name) + '/file', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path, content: '' }),
    });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); alert('创建失败：' + (e.detail || res.status)); return; }
    currentSkill.files.push({ path: path });
    currentSkill.files.sort(function(a, b){ return a.path < b.path ? -1 : (a.path > b.path ? 1 : 0); });
    setSkillContent('', path, true);
  } catch (e) {
    alert('创建失败：' + (e && e.message ? e.message : e));
  }
}

async function saveSkill() {
  if (!currentSkill.name || !currentSkillFile) return;
  var content = document.getElementById('skill-box-content').value;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name) + '/file', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: currentSkillFile, content: content }),
    });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); alert('保存失败：' + (e.detail || res.status)); return; }
    currentSkill.source = 'workspace';
    currentSkill.editable = true;
    currentSkill.persisted = true;
    if (!currentSkill.files.some(function(f){ return f.path === currentSkillFile; })) {
      currentSkill.files.push({ path: currentSkillFile });
    }
    appendSystem('已保存：' + currentSkill.name + ' / ' + currentSkillFile);
    renderSkillChrome();
    loadSkills();
  } catch (e) {
    alert('保存失败：' + (e && e.message ? e.message : e));
  }
}

async function deleteSkill() {
  if (!currentSkill.name) return;
  if (!confirm('删除自定义技能「' + currentSkill.name + '」（含全部子文件）？若存在同名内置技能将恢复显示。')) return;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name), { method: 'DELETE' });
    if (!res.ok) { alert('删除失败'); return; }
    appendSystem('技能已删除：' + currentSkill.name);
    closeSkillEditor();
    loadSkills();
  } catch (e) {
    alert('删除失败：' + (e && e.message ? e.message : e));
  }
}

// Copy a read-only builtin skill (all files) into the workspace for editing.
async function copySkillToWorkspace() {
  var name = currentSkill.name;
  if (!name) return;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(name) + '/copy', { method: 'POST' });

// ── Editor Panel ───────────────────────────────────────────────────────────
function openEditorPanel() {
  var panel = document.getElementById('editor-panel');
  panel.classList.add('open');
  document.getElementById('resizer-right').style.display = 'block';
  // Restore saved editor width
  try {
    var ew = localStorage.getItem('perrobot.editorW');
    if (ew) panel.style.width = ew;
  } catch (_) {}
}

function closeEditorPanel() {
  document.getElementById('editor-panel').classList.remove('open');
  document.getElementById('resizer-right').style.display = 'none';
}

function openFileInEditor(path, content, kind) {
  kind = kind || fileKind(path);
  if (!editorFiles.has(path)) {
    editorFiles.set(path, {
      content: content, originalContent: content, dirty: false, kind: kind
    });
  } else {
    var existing = editorFiles.get(path);
    existing.kind = kind;
    if (!existing.dirty) {
      existing.content = content;
      existing.originalContent = content;
    }
  }
  editorActiveTab = path;
  // Binary / preview-only kinds force view mode
  if (!isEditableKind(kind)) editorMode = 'view';
  openEditorPanel();
  renderEditorTabs();
  syncEditorToolbar();
  renderEditorContent();
}

function renderEditorTabs() {
  var tabsEl = document.getElementById('editor-tabs');
  tabsEl.innerHTML = '';
  editorFiles.forEach(function(state, path) {
    var tab = document.createElement('div');
    tab.className = 'editor-tab' + (path === editorActiveTab ? ' active' : '');
    var filename = path.split('/').pop();
    tab.innerHTML =
      '<span class="editor-tab-name" title="' + escapeAttr(path) + '">' + escapeHtml(filename) + '</span>' +
      (state.dirty ? '<span class="editor-tab-dirty">●</span>' : '') +
      '<button class="editor-tab-close" onclick="closeEditorTab(\'' + escapeAttr(path) + '\', event)" title="关闭">×</button>';
    var tabPath = path;
    tab.onclick = function(e) {
      if (e.target.classList.contains('editor-tab-close')) return;
      switchEditorTab(tabPath);
    };
    tabsEl.appendChild(tab);
  });
}

function switchEditorTab(path) {
  // Save current textarea content before switching
  saveCurrentTabContent();
  editorActiveTab = path;
  var state = editorFiles.get(path);
  if (state && !isEditableKind(state.kind)) editorMode = 'view';
  renderEditorTabs();
  syncEditorToolbar();
  renderEditorContent();
}

function saveCurrentTabContent() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;
  if (editorMode === 'edit' && isEditableKind(state.kind)) {
    var ta = document.getElementById('editor-textarea');
    state.content = ta.value;
    state.dirty = state.content !== state.originalContent;
  }
}

// Enable/disable toolbar buttons based on the active file's kind.
function syncEditorToolbar() {
  var state = editorActiveTab ? editorFiles.get(editorActiveTab) : null;
  var editable = state && isEditableKind(state.kind);
  var editBtn = document.getElementById('editor-edit-btn');
  var saveBtn = document.getElementById('editor-save-btn');
  editBtn.style.display = editable ? '' : 'none';
  saveBtn.style.display = editable ? '' : 'none';
}

function closeEditorTab(path, e) {
  e.stopPropagation();
  var state = editorFiles.get(path);
  if (state && state.dirty) {
    if (!confirm('文件 "' + path.split('/').pop() + '" 有未保存的更改，确定关闭？')) return;
  }
  editorFiles.delete(path);
  if (editorActiveTab === path) {
    var keys = Array.from(editorFiles.keys());
    editorActiveTab = keys.length > 0 ? keys[keys.length - 1] : null;
  }
  if (!editorActiveTab) {
    closeEditorPanel();
  } else {
    renderEditorTabs();
    renderEditorContent();
  }
}

function renderEditorContent() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;

  var path = editorActiveTab;
  var kind = state.kind || 'text';
  var content = state.content || '';

  // Status bar
  var statPath = document.getElementById('editor-stat-path');
  var statLines = document.getElementById('editor-stat-lines');
  var statBytes = document.getElementById('editor-stat-bytes');
  statPath.textContent = path;
  if (isEditableKind(kind)) {
    var bytes = new TextEncoder().encode(content).length;
    statLines.textContent = content.split('\n').length + ' 行';
    statBytes.textContent = formatSize(bytes);
  } else {
    statLines.textContent = kind.toUpperCase();
    statBytes.textContent = '';
  }

  var viewArea = document.getElementById('editor-view-area');
  var editArea = document.getElementById('editor-edit-area');

  // Edit mode: only for editable kinds
  if (editorMode === 'edit' && isEditableKind(kind)) {
    viewArea.style.display = 'none';
    editArea.style.display = 'flex';
    document.getElementById('editor-textarea').value = content;
    return;
  }

  // View mode (rich preview)
  editArea.style.display = 'none';
  viewArea.style.display = 'block';
  viewArea.innerHTML = '';

  if (kind === 'image') {
    viewArea.innerHTML = '<div class="preview-image-wrap"><img src="' +
      escapeAttr(downloadUrl(path)) + '" alt="' + escapeAttr(path) + '"></div>';
    return;
  }
  if (kind === 'pdf') {
    viewArea.innerHTML = '<iframe class="preview-frame" src="' +
      escapeAttr(downloadUrl(path)) + '"></iframe>';
    return;
  }
  if (kind === 'docx') {
    renderDocxPreview(path, viewArea);
    return;
  }
  if (kind === 'binary') {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📦</div>' +
      '<div>此文件类型暂不支持预览</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
    return;
  }
  if (kind === 'md') {
    var html = (typeof marked !== 'undefined')
      ? marked.parse(content) : ('<pre>' + escapeHtml(content) + '</pre>');
    viewArea.innerHTML = '<div class="preview-doc">' + html + '</div>';
    return;
  }
  if (kind === 'html') {
    var frame = document.createElement('iframe');
    frame.className = 'preview-frame';
    frame.setAttribute('sandbox', 'allow-same-origin');
    frame.srcdoc = content;
    viewArea.appendChild(frame);
    return;
  }

  // Default: code / plain text with syntax highlight
  var pre = document.createElement('pre');
  var code = document.createElement('code');
  code.textContent = content;
  var ext = (path.split('.').pop() || '').toLowerCase();
  if (CODE_LANGS[ext]) code.className = 'language-' + CODE_LANGS[ext];
  pre.appendChild(code);
  viewArea.appendChild(pre);
  // Highlight defensively — never let a highlighter error break the editor
  if (typeof hljs !== 'undefined') {
    try { hljs.highlightElement(code); } catch (_) {}
  }
}

// Render a .docx file by fetching its bytes and converting with mammoth.
async function renderDocxPreview(path, viewArea) {
  viewArea.innerHTML = '<div class="preview-loading">正在解析 Word 文档…</div>';
  if (typeof mammoth === 'undefined') {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📄</div>' +
      '<div>Word 预览组件未加载</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
    return;
  }
  try {
    var res = await apiFetch(downloadUrl(path));
    if (!res.ok) throw new Error('下载失败');
    var buf = await res.arrayBuffer();
    var result = await mammoth.convertToHtml({ arrayBuffer: buf });
    // Guard against stale tab switches
    if (editorActiveTab !== path) return;
    viewArea.innerHTML = '<div class="preview-doc">' +
      (result.value || '<p>(空文档)</p>') + '</div>';
  } catch (e) {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📄</div>' +
      '<div>无法预览此 Word 文档</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
  }
}

function setEditorMode(mode) {
  saveCurrentTabContent();
  // Binary / preview-only files can't be edited
  var state = editorActiveTab ? editorFiles.get(editorActiveTab) : null;
  if (mode === 'edit' && state && !isEditableKind(state.kind)) return;
  editorMode = mode;
  document.getElementById('editor-view-btn').classList.toggle('active', mode === 'view');
  document.getElementById('editor-edit-btn').classList.toggle('active', mode === 'edit');
  renderEditorContent();
}

async function saveCurrentFile() {
  saveCurrentTabContent();
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;

  try {
    var res = await apiFetch('/v1/files', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: editorActiveTab, content: state.content }),
    });
    if (res.ok) {
      state.originalContent = state.content;
      state.dirty = false;
      renderEditorTabs();
      appendSystem('文件已保存：' + editorActiveTab);
    } else {
      var err = await res.json();
      alert('保存失败：' + (err.detail || res.status));
    }
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

function downloadCurrentFile() {
  if (!editorActiveTab) return;
  var url = '/v1/files/download?path=' + encodeURIComponent(editorActiveTab);
  if (authToken) url += '&token=' + encodeURIComponent(authToken);
  window.open(url, '_blank');
}

// Track textarea changes for dirty detection
document.getElementById('editor-textarea').addEventListener('input', function() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;
  state.content = this.value;
  state.dirty = state.content !== state.originalContent;
  // Update dirty indicator on tab without full re-render
  var tabs = document.querySelectorAll('.editor-tab');
  var keys = Array.from(editorFiles.keys());
  var idx = keys.indexOf(editorActiveTab);
  if (idx >= 0 && tabs[idx]) {
    var dirtyEl = tabs[idx].querySelector('.editor-tab-dirty');
    if (state.dirty && !dirtyEl) {
      var nameEl = tabs[idx].querySelector('.editor-tab-name');
      var span = document.createElement('span');
      span.className = 'editor-tab-dirty';
      span.textContent = '●';
      nameEl.after(span);
    } else if (!state.dirty && dirtyEl) {
      dirtyEl.remove();
    }
  }
});

// Ctrl+S to save
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    var editorPanelEl = document.getElementById('editor-panel');
    if (editorPanelEl.classList.contains('open')) {
      e.preventDefault();
      saveCurrentFile();
    }
  }
});

// ── History loading ────────────────────────────────────────────────────────
async function loadHistory(sid) {
  try {
    var res = await apiFetch('/v1/sessions/web:' + encodeURIComponent(sid) + '/messages');
    if (!res.ok) return;
    var data = await res.json();
    var messages = data.messages || [];
    if (messages.length === 0) return;

    var divider = document.createElement('div');
    divider.className = 'history-divider';
    divider.textContent = '── 历史记录 (' + messages.length + ' 条) ──';
    chat.appendChild(divider);

    messages.forEach(function(m) {
      if (m.role === 'user') appendUser(m.content, true);
      else if (m.role === 'assistant') appendBot(m.content, true);
    });

    var endDivider = document.createElement('div');
    endDivider.className = 'history-divider';
    endDivider.textContent = '── 历史记录结束 ──';
    chat.appendChild(endDivider);
    scrollBottom();
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function connect() {
  var sid = currentSessionId;
  ws = new WebSocket(wsUrl(sid));

  ws.onopen = function() {
    dot.className = 'connected';
    appendSystem('已连接到会话「' + sid + '」');
    loadSessionList();
  };

  ws.onclose = function() {
    dot.className = '';
    streamFinalize();  // keep whatever streamed so far; drop the caret
    setBusy(false);
    appendSystem('连接断开，5 秒后重连…');
    setTimeout(connect, 5000);
  };

  ws.onerror = function() { ws.close(); };

  ws.onmessage = function(e) {
    var msg = JSON.parse(e.data);
    if (msg.type === 'token') {
      removeTyping();
      streamToken(msg.content);
    } else if (msg.type === 'token_cancel') {
      streamCancel();
    } else if (msg.type === 'progress') {
      removeTyping();
      appendStep(msg.content, false);
    } else if (msg.type === 'tool') {
      removeTyping();
      appendStep(msg.content, true);
    } else if (msg.type === 'skill') {
      removeTyping();
      appendSkillUsed(msg.content);
    } else if (msg.type === 'approval_request') {
      removeTyping();
      appendApprovalRequest(msg.id, msg.command, msg.reason);
    } else if (msg.type === 'message') {
      removeTyping();
      collapseCurrentSteps();
      // If we streamed this answer live, finalize that bubble; else append fresh.
      if (!streamFinalize(msg.content)) appendBot(msg.content);
      setBusy(false);
      loadSessionList();
    } else if (msg.type === 'push') {
      removeTyping();
      collapseCurrentSteps();
      streamCancel();  // discard any dangling live partial
      appendPush(msg.content);
      setBusy(false);
    }
  };
}

// ── Send ───────────────────────────────────────────────────────────────────
function sendMessage() {
  var text = input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  appendUser(text);
  ws.send(JSON.stringify({ content: text }));
  input.value = '';
  input.style.height = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
  streamBubbleEl = null;
  streamBuffer = '';
  showTyping();
  setBusy(true);
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', function() {
  input.style.height = '';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Session clear ──────────────────────────────────────────────────────────
async function clearSession() {
  var sid = currentSessionId;
  await apiFetch('/v1/sessions/web:' + encodeURIComponent(sid), { method: 'DELETE' });
  chat.innerHTML = '';
  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  appendSystem('会话「' + sid + '」已清除');
  loadSessionList();
}

async function triggerHeartbeat() {
  try {
    appendSystem('触发心跳中…');
    var res = await apiFetch('/v1/heartbeat/trigger', { method: 'POST' });
    var data = await res.json();
    if (data.error) {
      appendSystem('心跳触发失败：' + data.error);
    } else {
      appendSystem('心跳已触发，结果将以推送形式送达（若有任务）');
    }
  } catch (e) {
    appendSystem('心跳请求失败，请检查服务是否运行');
  }
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setBusy(v) {
  busy = v;
  sendBtn.disabled = v;
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function renderMarkdown(md) {
  if (typeof marked === 'undefined') return escapeHtml(md || '');
  return marked.parse(md || '');
}

// Post-process a rendered bubble: render mermaid diagrams + highlight code.
function enhanceBubble(bubbleEl) {
  if (!bubbleEl) return;
  // 1) Mermaid: ```mermaid blocks → rendered SVG
  var mermaidBlocks = bubbleEl.querySelectorAll('pre > code.language-mermaid');
  mermaidBlocks.forEach(function (code) {
    var pre = code.parentElement;
    var src = code.textContent || '';
    var holder = document.createElement('div');
    holder.className = 'mermaid';
    pre.replaceWith(holder);
    if (typeof mermaid === 'undefined') { holder.textContent = src; return; }
    var id = 'mmd-' + (++_mermaidSeq);
    try {
      mermaid.render(id, src).then(function (res) {
        holder.innerHTML = res.svg;
      }).catch(function (e) {
        holder.className = 'mermaid-error';
        holder.textContent = '图表渲染失败：' + (e && e.message ? e.message : e) + '\n\n' + src;
      });
    } catch (e) {
      holder.className = 'mermaid-error';
      holder.textContent = '图表渲染失败：' + (e && e.message ? e.message : e) + '\n\n' + src;
    }
  });
  // 2) Syntax-highlight remaining code blocks
  if (typeof hljs !== 'undefined') {
    bubbleEl.querySelectorAll('pre > code:not(.language-mermaid)').forEach(function (code) {
      try { hljs.highlightElement(code); } catch (_) {}
    });
  }
}

function appendUser(text, isHistory) {
  var el = document.createElement('div');
  el.className = 'msg user';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML =
    '<div class="avatar">👤</div>' +
    '<div class="bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>';
  chat.appendChild(el);
  if (!isHistory) scrollBottom();
}

function appendBot(text, isHistory) {
  var el = document.createElement('div');
  el.className = 'msg bot';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML =
    '<div class="avatar">🐕</div>' +
    '<div class="bubble">' + renderMarkdown(text) + '</div>';
  chat.appendChild(el);
  enhanceBubble(el.querySelector('.bubble'));
  if (!isHistory) scrollBottom();
}

function appendPush(text) {
  var el = document.createElement('div');
  el.className = 'msg push';
  el.innerHTML =
    '<div class="avatar">🔔</div>' +
    '<div class="bubble"><strong>系统通知</strong><br>' + renderMarkdown(text) + '</div>';
  chat.appendChild(el);
  enhanceBubble(el.querySelector('.bubble'));
  scrollBottom();
}

// ── Streaming bubble ───────────────────────────────────────────────────────
function streamToken(delta) {
  if (!streamBubbleEl) {
    var el = document.createElement('div');
    el.className = 'msg bot';
    el.innerHTML = '<div class="avatar">🐕</div><div class="bubble streaming"></div>';
    chat.appendChild(el);
    streamBubbleEl = el.querySelector('.bubble');
    streamBuffer = '';
  }
  streamBuffer += delta;
  streamBubbleEl.textContent = streamBuffer;  // plain while streaming (no partial-markdown flicker)
  scrollBottom();
}

// Turn turned out to be a tool-call preamble — discard the live partial.
function streamCancel() {
  if (streamBubbleEl) {
    var msgEl = streamBubbleEl.closest('.msg');
    if (msgEl) msgEl.remove();
  }
  streamBubbleEl = null;
  streamBuffer = '';
}

// Finalize the live bubble with canonical markdown. Returns true if one existed.
function streamFinalize(finalText) {
  if (!streamBubbleEl) return false;
  streamBubbleEl.classList.remove('streaming');
  streamBubbleEl.innerHTML = renderMarkdown(finalText != null ? finalText : streamBuffer);
  enhanceBubble(streamBubbleEl);
  streamBubbleEl = null;
  streamBuffer = '';
  scrollBottom();
  return true;
}

// ── Approval requests ──────────────────────────────────────────────────────
function appendApprovalRequest(id, command, reason) {
  collapseCurrentSteps();
  var el = document.createElement('div');
  el.className = 'approval-card';
  el.id = 'approval-' + id;
  el.innerHTML =
    '<div class="approval-head">⚠️ 需要你确认一个高危操作</div>' +
    '<div class="approval-reason">' + escapeHtml(reason || '') + '</div>' +
    '<pre class="approval-cmd">' + escapeHtml(command || '') + '</pre>' +
    '<div class="approval-actions">' +
      '<button class="btn danger" onclick="respondApproval(\'' + escapeAttr(id) + '\', false)">拒绝</button>' +
      '<button class="btn" onclick="respondApproval(\'' + escapeAttr(id) + '\', true)">批准执行</button>' +
    '</div>';
  chat.appendChild(el);
  scrollBottom();
}

function respondApproval(id, approved) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'approval_response', id: id, approved: approved }));
  }
  var card = document.getElementById('approval-' + id);
  if (card) {
    var actions = card.querySelector('.approval-actions');
    if (actions) actions.innerHTML =
      '<span class="approval-result ' + (approved ? 'ok' : 'no') + '">' +
      (approved ? '✓ 已批准' : '✕ 已拒绝') + '</span>';
    card.classList.add(approved ? 'approved' : 'denied');
  }
  if (!approved) showTyping();  // agent will adapt; keep the busy indicator alive
}

function appendSystem(text) {
  var el = document.createElement('div');
  el.className = 'history-divider';
  el.textContent = 'i ' + text;
  chat.appendChild(el);
  scrollBottom();
}

// ── Collapsible steps ──────────────────────────────────────────────────────
function ensureStepsGroup() {
  if (currentStepsGroup) return currentStepsGroup;

  var group = document.createElement('div');
  group.className = 'steps-group running';

  var toggle = document.createElement('button');
  toggle.className = 'steps-toggle';
  toggle.innerHTML =
    '<span class="arrow">▼</span>' +
    '<span class="step-summary">思考中…</span>' +
    '<span class="tool-chips"></span>';
  toggle.onclick = function() { group.classList.toggle('collapsed'); };

  var content = document.createElement('div');
  content.className = 'steps-content';

  group.appendChild(toggle);
  group.appendChild(content);
  chat.appendChild(group);
  currentStepsGroup = group;
  stepsCounter = 0;
  return group;
}

function extractToolName(text) {
  var m = text.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*[(\s"']?/);
  return m ? m[1] : text.split(/[\s("]/)[0];
}

function updateToggleChips(group) {
  var chipsEl = group.querySelector('.tool-chips');
  chipsEl.innerHTML = '';
  skillsUsed.forEach(function(name) {
    var chip = document.createElement('span');
    chip.className = 'skill-chip';
    chip.textContent = '✦ ' + name;
    chipsEl.appendChild(chip);
  });
  toolsUsed.forEach(function(name) {
    var chip = document.createElement('span');
    chip.className = 'tool-chip';
    chip.textContent = name;
    chipsEl.appendChild(chip);
  });
}

function appendSkillUsed(skillName) {
  if (!skillsUsed.includes(skillName)) skillsUsed.push(skillName);
  var group = ensureStepsGroup();
  updateToggleChips(group);
}

function appendStep(text, isTool) {
  var group = ensureStepsGroup();
  var content = group.querySelector('.steps-content');

  var el = document.createElement('div');
  el.className = 'step-item ' + (isTool ? 'tool' : 'progress');
  el.textContent = isTool ? ('⚙ ' + text) : ('💭 ' + text.slice(0, 400));
  content.appendChild(el);
  stepsCounter++;

  if (isTool) {
    var toolName = extractToolName(text);
    if (toolName && !toolsUsed.includes(toolName)) toolsUsed.push(toolName);
    updateToggleChips(group);
  }

  var summary = group.querySelector('.step-summary');
  summary.textContent = '思考中… (' + stepsCounter + ' 步)';
  content.style.maxHeight = (content.scrollHeight + 40) + 'px';
  scrollBottom();
}

function finalizeCurrentSteps() {
  if (!currentStepsGroup) return;
  var group = currentStepsGroup;
  group.classList.remove('running');

  var summary = group.querySelector('.step-summary');
  var parts = [];
  if (skillsUsed.length) parts.push(skillsUsed.length + ' 个技能');
  if (toolsUsed.length) parts.push(toolsUsed.length + ' 个工具');
  var toolLabel = parts.length ? '使用了 ' + parts.join(' · ') : '纯推理';
  summary.textContent = '✅ 完成 · ' + stepsCounter + ' 步 · ' + toolLabel;

  currentStepsGroup = null;
  stepsCounter = 0;
  toolsUsed = [];
  skillsUsed = [];
}

function collapseCurrentSteps() {
  finalizeCurrentSteps();
}

function showTyping() {
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(typingEl);
  scrollBottom();
}

function removeTyping() {
  if (typingEl) { typingEl.remove(); typingEl = null; }
}

function escapeHtml(t) {
  return String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttr(t) {
  return String(t).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// ── Start ──────────────────────────────────────────────────────────────────
boot();
</script>
