<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>perrobot 🐕</title>
<!-- Locally vendored libraries (no external CDN — works offline / behind firewall) -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/highlight.min.js"></script>
<script src="/vendor/mammoth.browser.min.js"></script>
<script src="/vendor/mermaid.min.js"></script>
<link rel="stylesheet" href="/vendor/github.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;            /* page / inset surfaces */
  --surface: #ffffff;       /* cards, bubbles, inputs */
  --sidebar: #f6f6f8;       /* light gray sidebar */
  --rail: #efeff3;          /* vertical nav rail (slightly darker) */
  --hover: #ececf0;         /* hover row bg */
  --active: #e4e4ec;        /* active row bg */
  --border: #ececef;        /* hairline borders */
  --border-soft: #f1f1f4;   /* very subtle row dividers */
  --text: #1f2024;          /* primary text */
  --text-dim: #6b6b76;      /* secondary text */
  --text-faint: #9a9aa6;    /* tertiary / metadata */
  --accent: #5c5cff;        /* indigo-violet accent */
  --accent-hover: #4444dd;
  --accent-soft: #eeeeff;   /* accent-tinted bg */
  --success: #27ae60;
  --danger: #e74c3c;
  --code-bg: #f6f8fa;       /* light code block bg */
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); height: 100vh; display: flex; flex-direction: column;
  overflow: hidden; color: var(--text); -webkit-font-smoothing: antialiased;
}

/* ── Auth Modal ── */
#auth-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
}
#auth-overlay.hidden { display: none; }
#auth-box {
  background: #fff; border-radius: 14px; padding: 32px 36px;
  width: 320px; box-shadow: 0 8px 40px rgba(0,0,0,.3);
  display: flex; flex-direction: column; gap: 16px;
}
#auth-box h2 { font-size: 1.2rem; color: var(--text); text-align: center; }
#auth-box p { font-size: 0.85rem; color: #666; text-align: center; }
#auth-username, #auth-password {
  border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px;
  font-size: 0.95rem; outline: none; width: 100%;
}
#auth-username:focus, #auth-password:focus { border-color: #5c5cff; }
#auth-username.hidden { display: none; }
#auth-submit {
  background: #5c5cff; color: #fff; border: none; border-radius: 8px;
  padding: 10px; font-size: 0.95rem; cursor: pointer; width: 100%;
}
#auth-submit:hover { background: #4444dd; }
#auth-error { color: #c0392b; font-size: 0.82rem; text-align: center; min-height: 18px; }

/* ── Header ── */
header {
  background: var(--surface); color: var(--text); padding: 10px 16px;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  border-bottom: 1px solid var(--border); z-index: 10;
}
header h1 { font-size: 1.1rem; white-space: nowrap; font-weight: 650; }
.header-spacer { flex: 1; }
#model-select {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer;
  max-width: 130px;
}
#model-select:focus { outline: none; border-color: var(--accent); }
#session-input {
  background: var(--bg); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 4px 8px; font-size: 0.8rem; width: 140px;
}
#session-input:focus { outline: none; border-color: var(--accent); }
.btn {
  background: var(--accent); color: #fff; border: none; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; font-size: 0.8rem; white-space: nowrap;
}
.btn:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); }
.btn.danger:hover { background: #a93226; }
.btn.secondary { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
.btn.secondary:hover { background: var(--hover); }
#status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--danger); flex-shrink: 0;
}
#status-dot.connected { background: var(--success); }
#toggle-sidebar {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1.1rem; padding: 0 6px; display: flex; align-items: center;
}
#toggle-sidebar:hover { color: var(--text); }

/* ── Main layout ── */
#main {
  flex: 1; display: flex; overflow: hidden;
}

/* ── Sidebar ── */
#sidebar {
  width: 240px; min-width: 160px; max-width: 480px;
  background: var(--sidebar); color: var(--text);
  display: flex; flex-direction: column; flex-shrink: 0;
  border-right: 1px solid var(--border); overflow: hidden;
}
#sidebar.collapsed { display: none; }

/* ── Resizers (drag to resize panels) ── */
.resizer {
  width: 5px; flex-shrink: 0; cursor: col-resize; background: transparent;
  position: relative; z-index: 5; transition: background 0.15s;
}
.resizer:hover, .resizer.dragging { background: var(--accent); }
#resizer-right { display: none; }
#sidebar.collapsed + #resizer-left { display: none; }
body.resizing { cursor: col-resize; user-select: none; }
body.resizing iframe { pointer-events: none; }

/* ── Rail (vertical nav) ── */
#rail {
  width: 60px; background: var(--rail); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding-top: 6px;
  flex-shrink: 0;
}
.rail-item {
  width: 100%; padding: 8px 0 6px; display: flex; flex-direction: column;
  align-items: center; gap: 3px; cursor: pointer; color: var(--text-dim);
  position: relative; border: none; background: transparent;
  transition: color 0.15s, background 0.15s;
}
.rail-item:hover { background: var(--hover); color: var(--text); }
.rail-item.active { color: var(--accent); }
.rail-item.active::before {
  content: ''; position: absolute; left: 0; top: 5px; bottom: 5px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--accent);
}
.rail-ic { display: flex; align-items: center; justify-content: center; height: 21px; }
.rail-ic svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.rail-lb { font-size: 0.6rem; }
.rail-sp { flex: 1; }
.rail-badge {
  position: absolute; top: 5px; right: 11px; width: 8px; height: 8px;
  border-radius: 50%; background: var(--danger); border: 1.5px solid var(--rail);
}

/* ── Sidebar Tabs (legacy, replaced by #rail) ── */
#sidebar-tabs { display: none; }

/* Placeholder panel for not-yet-built sections */
.panel-placeholder {
  flex: 1; display: flex; align-items: center; justify-content: center;
  text-align: center; color: var(--text-faint); font-size: 0.85rem; padding: 24px;
  line-height: 1.7;
}

/* ── Sidebar Panels (shared) ── */
.sidebar-panel {
  flex: 1; display: none; flex-direction: column; overflow: hidden;
}
.sidebar-panel.active { display: flex; }

/* ── Sessions Panel ── */
#sidebar-sessions-header {
  padding: 8px 14px; font-size: 0.82rem; font-weight: 600;
  color: var(--text-dim); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; gap: 6px;
}
#sidebar-sessions-header button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1rem; padding: 2px 6px; border-radius: 4px;
}
#sidebar-sessions-header button:hover { background: var(--hover); color: var(--text); }
#session-filter {
  flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font-size: 0.82rem; outline: none;
}
#session-filter:focus { border-color: var(--accent); }
#session-list {
  flex: 1; overflow-y: auto; padding: 4px 0;
}
.session-item {
  padding: 7px 14px; cursor: pointer; font-size: 0.82rem;
  border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
}
.session-item:hover { background: var(--hover); }
.session-item.active { background: var(--active); border-left: 3px solid var(--accent); }
.session-item-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.session-item .session-name {
  font-weight: 500; color: var(--text); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.session-item .session-time { font-size: 0.72rem; color: var(--text-faint); }
.session-item-actions { display: flex; gap: 2px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
.session-item:hover .session-item-actions { opacity: 1; }
.session-action-btn {
  background: none; border: none; color: var(--text-faint); cursor: pointer;
  font-size: 0.75rem; padding: 2px 4px; border-radius: 3px; line-height: 1;
}
.session-action-btn:hover { color: var(--danger); background: rgba(231,76,60,.12); }
.session-action-btn.export:hover { color: var(--success); background: rgba(39,174,96,.12); }
.session-action-btn.share:hover { color: var(--accent); background: var(--accent-soft); }
.ses-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: transparent;
}
.ses-dot.busy { background: var(--accent); animation: ses-pulse 1.2s ease-in-out infinite; }
.ses-dot.unread { background: var(--success); }
@keyframes ses-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ── Files Panel ── */
#files-toolbar {
  padding: 6px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  display: flex; flex-direction: column; gap: 5px;
}
#files-path-bar {
  display: flex; align-items: center; gap: 5px;
}
#files-path-input {
  flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 3px 7px; font-size: 0.75rem; outline: none;
  font-family: monospace;
}
#files-path-input:focus { border-color: var(--accent); }
.files-toolbar-row {
  display: flex; align-items: center; gap: 6px; font-size: 0.73rem; color: var(--text-dim);
}
#files-hidden-toggle { cursor: pointer; accent-color: var(--accent); }
#files-new-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer; margin-left: auto;
}
#files-new-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-workspace-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer;
}
#files-workspace-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-upload-btn {
  background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 4px;
  padding: 2px 7px; font-size: 0.72rem; cursor: pointer;
}
#files-upload-btn:hover { border-color: var(--accent); color: var(--accent); }
#files-breadcrumb {
  padding: 5px 10px; font-size: 0.73rem; color: var(--text-dim);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#files-breadcrumb span { cursor: pointer; color: var(--accent); }
#files-breadcrumb span:hover { text-decoration: underline; }
#files-search-bar { padding: 5px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#files-search {
  width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
  border-radius: 6px; padding: 5px 9px; font-size: 0.78rem; outline: none;
}
#files-search:focus { border-color: var(--accent); }
#files-list { flex: 1; overflow-y: auto; padding: 2px 0; }
.file-twisty {
  flex-shrink: 0; width: 12px; text-align: center; color: var(--text-faint);
  font-size: 0.62rem; user-select: none;
}
.file-item.selected { background: var(--active); }
.file-item {
  padding: 4px 10px; cursor: pointer; font-size: 0.79rem;
  display: flex; align-items: center; gap: 6px; color: var(--text);
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s;
}
.file-item:hover { background: var(--hover); }
.file-item .file-icon { flex-shrink: 0; font-size: 0.85rem; }
.file-item .file-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-item .file-size { font-size: 0.68rem; color: var(--text-faint); flex-shrink: 0; }

/* ── Skills Panel ── */
#skills-header {
  padding: 8px 14px; font-size: 0.82rem; font-weight: 600; color: var(--text-dim);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; flex-shrink: 0;
}
#skills-header button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1rem; padding: 2px 6px; border-radius: 4px;
}
#skills-header button:hover { background: var(--hover); color: var(--text); }
#skills-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.skill-item {
  padding: 9px 14px; cursor: pointer; border-bottom: 1px solid var(--border-soft);
  transition: background 0.15s;
}
.skill-item:hover { background: var(--hover); }
.skill-item-top { display: flex; align-items: center; gap: 7px; }
.skill-item-name { font-weight: 550; font-size: 0.83rem; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.skill-badge { font-size: 0.62rem; padding: 1px 6px; border-radius: 6px; flex-shrink: 0;
  font-weight: 600; letter-spacing: 0.02em; }
.skill-badge.workspace { background: var(--accent-soft); color: var(--accent); }
.skill-badge.builtin { background: var(--active); color: var(--text-dim); }
.skill-badge.always { background: #e7f7ef; color: #2e7d32; }
.skill-avail-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--success); }
.skill-avail-dot.unavailable { background: var(--text-faint); }
.skill-item-desc { font-size: 0.72rem; color: var(--text-dim); margin-top: 3px;
  line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; }
.skill-item-req { font-size: 0.68rem; color: #c0392b; margin-top: 3px; }

/* ── Skill Editor Modal ── */
#skill-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: flex; align-items: center; justify-content: center; z-index: 1000;
}
#skill-overlay.hidden { display: none; }
#skill-box {
  background: var(--surface); border-radius: 14px; width: min(760px, 92vw);
  height: min(80vh, 720px); box-shadow: 0 12px 50px rgba(0,0,0,.3);
  display: flex; flex-direction: column; overflow: hidden;
}
#skill-box-header {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#skill-box-title { font-weight: 650; font-size: 0.98rem; }
#skill-box-badge { font-size: 0.65rem; padding: 1px 7px; border-radius: 6px; }
#skill-box-close { background: none; border: none; cursor: pointer; color: var(--text-dim);
  font-size: 0.95rem; padding: 4px 8px; }
#skill-box-close:hover { color: var(--text); }
#skill-box-hint { padding: 8px 16px; font-size: 0.76rem; color: var(--text-dim);
  background: var(--bg); border-bottom: 1px solid var(--border); flex-shrink: 0; }
#skill-box-hint.hidden { display: none; }
#skill-box-body { flex: 1; display: flex; min-height: 0; }
#skill-file-pane {
  width: 190px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); background: var(--bg); overflow: hidden;
}
#skill-file-pane-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px; font-size: 0.72rem; font-weight: 600; color: var(--text-dim);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#skill-newfile-btn {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 0.95rem; line-height: 1; padding: 0 4px; border-radius: 4px;
}
#skill-newfile-btn:hover { background: var(--hover); color: var(--text); }
#skill-file-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.skill-file-item {
  padding: 6px 12px; font-size: 0.77rem; cursor: pointer; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.skill-file-item:hover { background: var(--hover); color: var(--text); }
.skill-file-item.active { background: var(--active); color: var(--text); font-weight: 550; }
#skill-box-content {
  flex: 1; min-width: 0; border: none; outline: none; resize: none; padding: 14px 16px;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 0.82rem;
  line-height: 1.6; color: var(--text); background: var(--surface);
}
#skill-box-content:read-only { background: var(--bg); color: var(--text-dim); }
#skill-box-actions {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  border-top: 1px solid var(--border); flex-shrink: 0;
}

/* ── Chat Panel ── */
#chat-panel {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  min-width: 0;
}
#chat {
  flex: 1; overflow-y: auto;
}

/* ── Reports panel ── */
#reports-header {
  padding: 8px 12px; display: flex; gap: 6px; align-items: center;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
#reports-header input {
  flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 6px;
  padding: 5px 9px; font-size: 0.78rem; outline: none;
}
#reports-header input:focus { border-color: var(--accent); }
#reports-header button {
  background: none; border: none; color: var(--text-dim); cursor: pointer;
  font-size: 1rem; padding: 2px 6px; border-radius: 4px;
}
#reports-header button:hover { background: var(--hover); color: var(--text); }
#reports-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.report-grp { padding: 8px 13px 3px; font-size: 0.63rem; color: var(--text-faint); text-transform: uppercase; font-weight: 600; }
.report-item { margin: 2px 7px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.report-item:hover { background: var(--hover); }
.report-item.active { background: var(--active); }
.report-title { font-size: 0.83rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.report-meta { font-size: 0.69rem; color: var(--text-faint); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.report-badge { font-size: 0.6rem; padding: 1px 6px; border-radius: 20px; font-weight: 600; }
.report-badge.pub { background: #e7f6ed; color: var(--success); }
.report-badge.draft { background: #fdf0dd; color: var(--warn); }
.report-snap { font-size: 0.62rem; color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.report-actions { display: flex; gap: 6px; margin-top: 7px; }
.report-actions button { font-size: 0.68rem; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); cursor: pointer; }
.report-actions button.ref { color: var(--accent); border-color: #d5d5ff; }
.report-actions button:hover { background: var(--hover); }

/* ── Cron panel ── */
#cron-header { padding: 9px 12px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#cron-header .ttl { flex: 1; font-weight: 600; font-size: 0.83rem; }
#cron-header button { border: none; background: var(--accent); color: #fff; cursor: pointer; font-size: 0.72rem; padding: 4px 9px; border-radius: 6px; }
#cron-header button.g { background: transparent; color: var(--text-dim); font-size: 0.95rem; padding: 2px 6px; }
#cron-header button.g:hover { background: var(--hover); }
#cron-list { flex: 1; overflow-y: auto; padding: 4px 0; }
.cron-item { margin: 3px 8px; padding: 9px 11px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
.cron-item:hover { background: var(--hover); }
.cron-name { font-size: 0.84rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cron-sub { font-size: 0.7rem; color: var(--text-faint); margin-top: 3px; display: flex; align-items: center; gap: 5px; }
.cron-st { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cron-st.ok { background: var(--success); } .cron-st.fail { background: var(--danger); } .cron-st.off { background: var(--text-faint); }

/* ── Generic modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.show { display: flex; }
.modal-box { background: #fff; border-radius: 14px; padding: 22px 24px; width: 440px; max-height: 88vh; overflow-y: auto; box-shadow: 0 12px 50px rgba(0,0,0,.28); }
.modal-box h3 { font-size: 1.03rem; margin-bottom: 13px; }
.mb-row { margin-bottom: 13px; }
.mb-row label { display: block; font-size: 0.77rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
.mb-inp { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; font-size: 0.85rem; outline: none; font-family: inherit; }
.mb-inp:focus { border-color: var(--accent); }
.mb-freq { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.mb-chk { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; margin-bottom: 7px; }
.mb-note { font-size: 0.71rem; color: var(--text-faint); margin-top: 5px; }
.mb-acts { display: flex; gap: 9px; margin-top: 15px; align-items: center; }
.mb-field { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); font-size: 0.84rem; }
.mb-field .k { width: 84px; color: var(--text-dim); flex-shrink: 0; }
.mb-warn { background: #fdeaea; border: 1px solid #f5c6c6; color: #a3352b; padding: 9px 12px; border-radius: 9px; font-size: 0.8rem; margin-bottom: 12px; line-height: 1.5; }
.mb-sw { width: 32px; height: 18px; border-radius: 20px; background: var(--text-faint); position: relative; cursor: pointer; flex-shrink: 0; }

.mb-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left 0.15s; }
.mb-sw.on::after { left: 16px; }

/* ── Referenced-report chip (above input) ── */
#ref-bar { flex-shrink: 0; padding: 8px max(16px, calc((100% - 820px) / 2)) 0; }
#ref-bar .picked {
  display: inline-flex; align-items: center; gap: 7px; background: var(--accent-soft);
  border: 1px solid #e0e0ff; color: var(--accent); border-radius: 8px;
  padding: 5px 10px; font-size: 0.74rem;
}
#ref-bar .picked .rx { cursor: pointer; font-weight: 700; padding: 0 2px; }
#ref-bar .picked .rx:hover { color: var(--accent-hover); }

/* ── Session artifacts bar ── */
#chat-artifacts-bar {
  flex-shrink: 0; display: none; align-items: center; justify-content: flex-end;
  gap: 8px; padding: 6px max(16px, calc((100% - 820px) / 2));
  border-bottom: 1px solid var(--border); position: relative;
}
#chat-artifacts-bar.show { display: flex; }
.art-chip {
  display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft);
  border: 1px solid #e0e0ff; color: var(--accent); border-radius: 8px;
  padding: 4px 10px; font-size: 0.75rem; cursor: pointer; font-weight: 500;
}
.art-chip:hover { background: #e4e4ff; }
.art-chip svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.art-chip .b { background: var(--accent); color: #fff; border-radius: 20px; padding: 0 6px; font-size: 0.65rem; font-weight: 700; }
.art-pop {
  position: absolute; top: 38px; right: max(16px, calc((100% - 820px) / 2));
  width: 340px; max-height: 62vh; overflow-y: auto; background: #fff;
  border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.16); z-index: 40; display: none;
}
.art-pop.show { display: block; }
.ap-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
.ap-head .all { font-size: 0.71rem; color: var(--accent); cursor: pointer; font-weight: 500; }
.ap-grp { padding: 8px 14px 3px; font-size: 0.64rem; color: var(--text-faint); text-transform: uppercase; font-weight: 600; }
.ap-item { padding: 7px 14px; display: flex; align-items: center; gap: 9px; cursor: pointer; }
.ap-item:hover { background: var(--hover); }
.ap-item .ic { font-size: 0.95rem; flex-shrink: 0; width: 18px; text-align: center; }
.ap-item .nm { flex: 1; font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-item .tm { font-size: 0.67rem; color: var(--text-faint); flex-shrink: 0; }
.ap-item .tag { font-size: 0.59rem; padding: 1px 6px; border-radius: 5px; font-weight: 600; flex-shrink: 0; }
.ap-item .tag.rep { background: var(--accent-soft); color: var(--accent); }
.ap-item .tag.data { background: #e7f6ed; color: var(--success); }
.ap-sec.muted { border-top: 1px solid var(--border-soft); }
.ap-sec.muted .nm { color: var(--text-dim); }
.ap-empty { padding: 16px; text-align: center; color: var(--text-faint); font-size: 0.78rem; }
.ses-artifact-count {
  font-size: 0.62rem; background: var(--accent-soft); color: var(--accent);
  border-radius: 20px; padding: 0 6px; font-weight: 600; flex-shrink: 0; align-self: center;
}
.chat-session {
  display: flex; flex-direction: column; gap: 16px; min-height: 100%;
  padding: 24px max(16px, calc((100% - 820px) / 2));
}

/* ── Message bubbles ── */
.msg { display: flex; gap: 10px; max-width: 88%; }
.msg.user { flex-direction: row-reverse; align-self: flex-end; }
.msg.bot  { align-self: flex-start; }
.msg.push { align-self: center; max-width: 96%; }
.avatar {
  width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem; background: var(--active);
}
.msg.user .avatar { background: var(--active); }
.msg.bot  .avatar { background: linear-gradient(135deg, #5c5cff, #7c5cff); }
.msg.push .avatar { background: #f39c12; }
.bubble {
  padding: 11px 15px; border-radius: 14px; line-height: 1.6;
  font-size: 0.9rem; word-break: break-word;
}
.msg.user .bubble {
  background: var(--accent); color: #fff; border-top-right-radius: 4px;
}
.msg.bot .bubble {
  background: var(--surface); color: var(--text); border-top-left-radius: 4px;
  border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.msg.push .bubble {
  background: #fff8e6; color: #8a6d1a; border-radius: 10px;
  border: 1px solid #f0d480; font-size: 0.85rem; width: 100%;
}
.bubble pre { background: var(--code-bg); border: 1px solid var(--border);
              border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
.bubble code { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; font-size: 0.85em; }
.bubble p > code, .bubble li > code { background: #f1f1f4; padding: 1.5px 5px; border-radius: 5px; }
.bubble p { margin-bottom: 8px; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { padding-left: 20px; margin-bottom: 8px; }
.bubble h1,.bubble h2,.bubble h3 { margin: 10px 0 5px; }
.msg.user .bubble pre { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.2); }
.msg.user .bubble p > code, .msg.user .bubble li > code { background: rgba(255,255,255,.18); color: #fff; }
.msg.user .bubble code { color: #fff; }
.msg.user .bubble a { color: #fff; text-decoration: underline; }
/* Live-streaming bubble: show raw text with a blinking caret */
.bubble.streaming { white-space: pre-wrap; position: relative; }
.bubble.streaming::after {
  content: '▋'; color: var(--accent); margin-left: 1px;
  animation: caret-blink 1s steps(2, start) infinite;
}
@keyframes caret-blink { to { visibility: hidden; } }
.stream-rate {
  display: block;
  font-size: 0.7rem; color: var(--text-faint);
  text-align: right; margin-top: 3px;
  pointer-events: none;
}
/* Tables rendered from markdown (GFM) */
.bubble table { border-collapse: collapse; margin: 8px 0; font-size: 0.85em;
                display: block; overflow-x: auto; max-width: 100%; }
.bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
.bubble th { background: #f7f7fa; font-weight: 600; }
.bubble tr:nth-child(even) td { background: #fafafe; }
.bubble blockquote { border-left: 3px solid var(--border); padding-left: 12px;
                     color: var(--text-dim); margin: 6px 0; }
.bubble a { color: var(--accent); }
/* Mermaid diagrams */
.bubble .mermaid { background: #fbfbfe; border: 1px solid var(--border); border-radius: 8px;
                   padding: 10px; margin: 8px 0; text-align: center; overflow-x: auto; }
.bubble .mermaid svg { max-width: 100%; height: auto; }
.bubble .mermaid-error { background: #fff8e6; border: 1px solid #f0d480; color: #8a6d1a;
                         border-radius: 6px; padding: 8px 10px; margin: 8px 0;
                         font-size: 0.8rem; white-space: pre-wrap; }

/* ── Approval card ── */
.approval-card {
  align-self: center; width: 100%; max-width: 760px;
  background: #fff8e6; border: 1px solid #f0d480; border-radius: 12px;
  padding: 12px 14px; margin: 2px 0;
}
.approval-card.approved { background: #f0f9f2; border-color: #bfe3c9; }
.approval-card.denied { background: #fdeceb; border-color: #f3c4c0; }
.approval-head { font-weight: 650; font-size: 0.86rem; color: #8a6d1a; margin-bottom: 6px; }
.approval-card.approved .approval-head { color: #2e7d32; }
.approval-card.denied .approval-head { color: #c0392b; }
.approval-reason { font-size: 0.82rem; color: var(--text); margin-bottom: 8px; }
.approval-cmd {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem;
  white-space: pre-wrap; word-break: break-all; margin-bottom: 10px; color: var(--text);
}
.approval-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.approval-result { font-size: 0.82rem; font-weight: 600; }
.approval-result.ok { color: #2e7d32; }
.approval-result.no { color: #c0392b; }

/* ── Steps ── */
.steps-group { align-self: flex-start; max-width: 92%; margin: 2px 0; }
.steps-toggle {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  cursor: pointer; user-select: none; font-size: 0.78rem; color: var(--text-dim);
  padding: 7px 12px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 11px; transition: background 0.15s; text-align: left; width: 100%;
}
.steps-toggle:hover { background: var(--hover); }
.steps-toggle .arrow { display: inline-block; transition: transform 0.2s; font-size: 0.65rem; flex-shrink: 0; }
.steps-group.collapsed .arrow { transform: rotate(-90deg); }
.steps-group:not(.collapsed) .arrow { transform: rotate(0deg); }
.steps-toggle .step-summary { flex-shrink: 0; }
.steps-toggle .tool-chips { display: flex; flex-wrap: wrap; gap: 4px; }
.tool-chip {
  font-size: 0.7rem; padding: 1px 7px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent); font-family: monospace;
  white-space: nowrap;
}
.skill-chip {
  font-size: 0.7rem; padding: 1px 7px; border-radius: 7px;
  background: #e7f7ef; color: #2e7d32; font-family: monospace;
  white-space: nowrap;
}
.steps-group.running .steps-toggle { background: var(--accent-soft); color: var(--text-dim); }
.steps-content { margin-top: 4px; padding: 0; overflow: hidden; transition: max-height 0.3s ease; }
.steps-group.collapsed .steps-content { max-height: 0 !important; }
.steps-content .step-item {
  font-size: 0.78rem; padding: 5px 11px; margin: 2px 0;
  border-radius: 9px; word-break: break-word; white-space: pre-wrap;
}
.step-item.progress { color: var(--text-dim); background: var(--bg); }
.step-item.tool {
  color: var(--accent); background: var(--accent-soft); font-family: monospace;
  border-left: 3px solid var(--accent); border-radius: 0 9px 9px 0; padding-left: 8px;
}

/* ── File chips (files written by agent this turn) ── */
.file-chips-row {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 2px 16px 10px calc(40px + 16px);
}
.file-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid rgba(92,92,255,.22); border-radius: 7px;
  padding: 4px 11px 4px 9px; font-size: 0.75rem; cursor: pointer;
  font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
  white-space: nowrap; max-width: 260px;
  overflow: hidden; text-overflow: ellipsis;
  transition: background 0.13s;
}
.file-chip:hover { background: var(--active); border-color: var(--accent); }

/* ── Typing indicator ── */
.typing {
  align-self: flex-start; display: flex; gap: 5px; padding: 11px 15px;
  background: var(--surface); border-radius: 14px; border-top-left-radius: 4px;
  border: 1px solid var(--border);
}
.typing span {
  width: 7px; height: 7px; background: var(--text-faint); border-radius: 50%;
  animation: bounce 1.2s infinite;
}
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes bounce {
  0%,60%,100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ── Input bar ── */
#input-bar {
  background: var(--bg);
  padding: 12px max(16px, calc((100% - 820px) / 2)) 18px;
  display: flex; gap: 8px; flex-shrink: 0; align-items: flex-end;
  border-top: 1px solid var(--border);
}
#msg-input {
  flex: 1; border: 1px solid var(--border); border-radius: 16px;
  padding: 10px 16px; font-size: 0.9rem; resize: none; outline: none;
  max-height: 120px; overflow-y: auto; line-height: 1.45; font-family: inherit;
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.04); transition: border-color 0.15s;
}
#msg-input:focus { border-color: var(--accent); }
#send-btn {
  background: var(--accent); color: #fff; border: none; border-radius: 12px;
  padding: 9px 18px; cursor: pointer; font-size: 0.9rem; align-self: flex-end;
}
#send-btn:hover { background: var(--accent-hover); }
#send-btn:disabled { background: var(--text-faint); cursor: default; }
#attach-btn {
  background: none; border: none; cursor: pointer; font-size: 1.15rem;
  align-self: flex-end; padding: 8px 4px; line-height: 1; opacity: 0.65;
}
#attach-btn:hover { opacity: 1; }
#attach-btn:disabled { opacity: 0.3; cursor: default; }

/* ── History divider ── */
.history-divider {
  align-self: center; font-size: 0.75rem; color: var(--text-faint);

}

}

  background: none; border: 1px solid #ddd; border-radius: 4px; cursor: pointer;
  color: #555; font-size: 0.75rem; padding: 3px 9px;
}

#editor-save-btn:hover { background: #219a52; }

  flex: 1; overflow: hidden; display: flex; flex-direction: column;
}
#editor-view-area {
  flex: 1; overflow: auto; padding: 0; background: #fff;
}
#editor-view-area pre {
  margin: 0; padding: 16px;
  font-family: 'Fira Code', 'Courier New', monospace;
  font-size: 0.82rem; line-height: 1.6; white-space: pre-wrap; word-break: break-all;

/* Rich preview containers */
.preview-doc {

  max-width: 860px; margin: 0 auto;
}

.preview-doc th, .preview-doc td { border: 1px solid #ddd; padding: 5px 10px; }
.preview-doc img { max-width: 100%; }
.preview-doc pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow-x: auto; }
.preview-doc code { background: #f0f0f4; padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }

<!-- Auth Modal -->
