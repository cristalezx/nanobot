}
function openNewCron() { document.getElementById('cron-new-overlay').classList.add('show'); onCronFreq(); }
function closeCronNew() { document.getElementById('cron-new-overlay').classList.remove('show'); }
function onCronFreq() {
  var f = document.getElementById('cron-freq').value;
  var ex = document.getElementById('cron-freq-extra');
  if (f === 'daily') {
    ex.innerHTML = '<input class="mb-inp" style="width:90px" id="cron-time" value="08:00">';
  } else if (f === 'weekly') {
    ex.innerHTML = '周<select class="mb-inp" style="width:auto" id="cron-dow"><option value="1">一</option><option value="2">二</option><option value="3">三</option><option value="4">四</option><option value="5">五</option><option value="6">六</option><option value="0">日</option></select> <input class="mb-inp" style="width:90px" id="cron-time" value="08:00">';
  } else if (f === 'monthly') {
    ex.innerHTML = '<input class="mb-inp" style="width:56px" id="cron-dom" value="1"> 号 <input class="mb-inp" style="width:90px" id="cron-time" value="09:00">';
  } else {
    ex.innerHTML = '<input class="mb-inp" style="width:170px" id="cron-expr" value="0 8 * * 1" placeholder="cron 表达式">';
  }
}
function buildCronBody() {
  var f = document.getElementById('cron-freq').value;
  var name = (document.getElementById('cron-name').value || '').trim();
  var msg = (document.getElementById('cron-msg').value || '').trim();
  var deliver = document.getElementById('cron-deliver').classList.contains('on');
  if (!msg) { alert('请填写要让助手做什么'); return null; }
  if (!name) name = msg.slice(0, 20);
  var expr;
  if (f === 'cron') {
    expr = (document.getElementById('cron-expr').value || '').trim();
    if (!expr) { alert('请填写 cron 表达式'); return null; }
  } else {
    var time = (document.getElementById('cron-time').value || '08:00').split(':');
    var hh = parseInt(time[0] || '8', 10), mm = parseInt(time[1] || '0', 10);
    if (f === 'daily') expr = mm + ' ' + hh + ' * * *';
    else if (f === 'weekly') expr = mm + ' ' + hh + ' * * ' + document.getElementById('cron-dow').value;
    else expr = mm + ' ' + hh + ' ' + (document.getElementById('cron-dom').value || '1') + ' * *';
  }
  return { name: name, message: msg, schedule_kind: 'cron', expr: expr, deliver: deliver };
}
async function submitNewCron() {
  var body = buildCronBody(); if (!body) return;
  try {
    var res = await apiFetch('/v1/cron', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) { closeCronNew(); appendSystem('已创建定时任务「' + body.name + '」'); loadCron(); }
    else { var e = await res.json().catch(function() { return {}; }); appendSystem('创建失败：' + (e.detail || res.status)); }
  } catch (e) { appendSystem('创建失败：' + e); }
}

function showTyping() {
  var s = getSes(currentSessionId);
  s.typingEl = document.createElement('div');
  s.typingEl.className = 'typing';
  s.typingEl.innerHTML = '<span></span><span></span><span></span>';
  chatAppend(s.typingEl);
  scrollBottom();
}

function removeTyping() {
  var s = getSes(currentSessionId);
  if (s.typingEl) { s.typingEl.remove(); s.typingEl = null; }
}

function escapeHtml(t) {
  return String(t)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function escapeAttr(t) {
  return String(t).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// ── File search ────────────────────────────────────────────────────────────
async function filterFileTree(q) {
  q = (q || '').trim().toLowerCase();
  if (!q) { rebuildTree(); return; }
  var list = document.getElementById('files-list');
  list.innerHTML = '<div style="padding:8px 12px;color:var(--text-dim);font-size:0.78rem;">搜索中…</div>';
  try {
    var allFiles = await collectAllFiles('', 0);
    var matches = allFiles.filter(function(f) {
      return f.name.toLowerCase().includes(q) || f.path.toLowerCase().includes(q);
    });
    list.innerHTML = '';
    if (!matches.length) {
      list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:0.78rem;">未找到匹配文件</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    matches.forEach(function(f) {
      var el = document.createElement('div');
      el.className = 'file-item';
      el.style.paddingLeft = '10px';
      el.innerHTML =
        '<span class="file-twisty"></span>' +
        '<span class="file-icon">📄</span>' +
        '<span class="file-name" title="' + escapeAttr(f.path) + '">' + escapeHtml(f.path) + '</span>' +
        '<span class="file-size">' + formatSize(f.size) + '</span>';
      var p = f.path, name = f.name;
      el.onclick = function() { openFile(p, name); };
      frag.appendChild(el);
    });
    list.appendChild(frag);
  } catch (e) {
    list.innerHTML = '<div style="padding:12px;color:#e74c3c;font-size:0.78rem;">搜索失败：' + escapeHtml(e.message) + '</div>';
  }
}

async function collectAllFiles(dirPath, depth) {
  if (depth > 8) return [];
  try {
    var data = await fetchDir(dirPath);
    var showHidden = document.getElementById('files-hidden-toggle').checked;
    var entries = (data.entries || []).filter(function(e) {
      return showHidden || !e.name.startsWith('.');
    });
    var result = [];
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (e.type === 'file') {
        result.push(e);
      } else if (e.type === 'dir') {
        var sub = await collectAllFiles(e.path, depth + 1);
        result = result.concat(sub);
      }
    }
    return result;
  } catch (_) { return []; }
}
