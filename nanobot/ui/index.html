<script>
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });
if (typeof mermaid !== 'undefined') {
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
}
let _mermaidSeq = 0;

// ── Global state ──────────────────────────────────────────────────────────
// currentSessionId: the session being processed (temporarily changes during WS routing)
// activeSessionId:  the session visible to the user (never changes during routing)
let currentSessionId = 'default';
let activeSessionId  = 'default';
let authToken = sessionStorage.getItem('nanobotToken') || '';
let authUsername = sessionStorage.getItem('nanobotUser') || '';
let _isMultiUser = false;

// Per-session state lives in sesStore — see getSes().

// File browser state
let currentFilePath = '';
let allSessions = [];

// ── Per-session store ─────────────────────────────────────────────────────
const sesStore = new Map();

function getSes(sid) {
  if (!sesStore.has(sid)) {
    var el = document.createElement('div');
    el.className = 'chat-session';
    el.id = 'chat-ses-' + sid;
    el.style.display = 'none';
    chat.appendChild(el);
    sesStore.set(sid, {
      ws: null, busy: false, unread: false, chatEl: el,
      typingEl: null, streamBubbleEl: null, streamBuffer: '',
      streamRateEl: null, _streamTextNode: null, streamTokenCount: 0, streamStartTime: 0,
      currentStepsGroup: null, stepsCounter: 0,
      toolsUsed: [], skillsUsed: [], filesWrittenThisTurn: [],
      sessionArtifacts: [],  // {path, name} accumulated across the whole session
      referencedReport: null  // {path, name, snapshot} — report referenced for follow-up
    });
  }
  return sesStore.get(sid);
}

// Append el to the chat div of the session currently being processed.
function chatAppend(el) {
  getSes(currentSessionId).chatEl.appendChild(el);
}

// Editor state
// Map<path, {content: string, originalContent: string, dirty: bool}>
const editorFiles = new Map();
let editorActiveTab = null; // path
let editorMode = 'view'; // 'view' | 'edit'

// DOM refs
const chat        = document.getElementById('chat');
const input       = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const dot         = document.getElementById('status-dot');
const sessInput   = document.getElementById('session-input');
const sidebar     = document.getElementById('sidebar');
const sessionList = document.getElementById('session-list');

// ── Panel resizing (drag handles) ──────────────────────────────────────────
function setupResizer(handleId, getEl, opts) {
  var handle = document.getElementById(handleId);
  if (!handle) return;
  handle.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var el = getEl();
    if (!el) return;
    var startX = e.clientX;
    var startW = el.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.classList.add('resizing');
    function onMove(ev) {
      // dir = +1 means panel grows when dragging right; -1 means grows when dragging left
      var delta = (ev.clientX - startX) * (opts.dir || 1);
      var w = Math.max(opts.min, Math.min(opts.max, startW + delta));
      el.style.width = w + 'px';
    }
    function onUp() {
      handle.classList.remove('dragging');
      document.body.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      try { localStorage.setItem(opts.key, el.style.width); } catch (_) {}
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

setupResizer('resizer-left', function() { return sidebar; },
  { min: 160, max: 480, dir: 1, key: 'perrobot.sidebarW' });
setupResizer('resizer-right', function() { return document.getElementById('editor-panel'); },
  { min: 280, max: 1100, dir: -1, key: 'perrobot.editorW' });

// Restore saved widths
try {
  var sw = localStorage.getItem('perrobot.sidebarW');
  if (sw) sidebar.style.width = sw;
} catch (_) {}

// ── File type detection ─────────────────────────────────────────────────────
var CODE_LANGS = {
  py: 'python', js: 'javascript', ts: 'typescript', jsx: 'javascript', tsx: 'typescript',
  sh: 'bash', bash: 'bash', json: 'json', css: 'css', scss: 'css',
  xml: 'xml', yaml: 'yaml', yml: 'yaml', java: 'java', go: 'go', rs: 'rust',
  c: 'c', cpp: 'cpp', h: 'cpp', rb: 'ruby', php: 'php', sql: 'sql', toml: 'ini', ini: 'ini'
};
var IMAGE_EXTS = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'bmp', 'ico'];

function fileKind(path) {
  var ext = (path.split('.').pop() || '').toLowerCase();
  if (ext === 'md' || ext === 'markdown') return 'md';
  if (ext === 'html' || ext === 'htm') return 'html';
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  if (IMAGE_EXTS.indexOf(ext) >= 0) return 'image';
  if (ext === 'doc' || ext === 'xls' || ext === 'xlsx' || ext === 'ppt' ||
      ext === 'pptx' || ext === 'zip' || ext === 'tar' || ext === 'gz' ||
      ext === 'exe' || ext === 'bin' || ext === 'so' || ext === 'dylib') return 'binary';
  return 'text';
}

// Editable kinds (can be loaded as text & saved)
function isEditableKind(kind) {
  return kind === 'text' || kind === 'md' || kind === 'html';
}

function downloadUrl(path) {
  var u = '/v1/files/download?path=' + encodeURIComponent(path);
  if (authToken) u += '&token=' + encodeURIComponent(authToken);
  return u;
}

// ── Auth helpers ───────────────────────────────────────────────────────────
function apiFetch(url, options) {
  options = options || {};
  var headers = Object.assign({}, options.headers || {});
  if (authToken) headers['X-Token'] = authToken;
  return fetch(url, Object.assign({}, options, { headers: headers }));
}

function wsUrl(sid) {
  var proto = location.protocol === 'https:' ? 'wss' : 'ws';
  var base = proto + '://' + location.host + '/v1/ws/' + encodeURIComponent(sid);
  return authToken ? base + '?token=' + encodeURIComponent(authToken) : base;
}

// ── Boot / Auth flow ───────────────────────────────────────────────────────
async function boot() {
  try {
    var res = await fetch('/v1/auth/required');
    var data = await res.json();
    _isMultiUser = !!data.multi_user;
    if (!data.required) {
      var r = await fetch('/v1/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({}),
      });
      var d = await r.json();
      authToken = d.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      init();
      return;
    }
    if (authToken) {
      var probe = await apiFetch('/v1/sessions');
      if (probe.ok) { init(); return; }
      authToken = '';
      authUsername = '';
      sessionStorage.removeItem('nanobotToken');
      sessionStorage.removeItem('nanobotUser');
    }
    showAuthModal();
  } catch (e) {
    console.error('Boot error:', e);
    showAuthModal();
  }
}

function showAuthModal() {
  var unEl = document.getElementById('auth-username');
  var hint = document.getElementById('auth-hint');
  if (_isMultiUser) {
    unEl.classList.remove('hidden');
    hint.textContent = '请输入用户名和密码';
  } else {
    unEl.classList.add('hidden');
    hint.textContent = '请输入访问密码';
  }
  document.getElementById('auth-overlay').classList.remove('hidden');
  if (_isMultiUser) {
    document.getElementById('auth-username').focus();
  } else {
    document.getElementById('auth-password').focus();
  }
}

function _setAuthUser(username) {
  authUsername = username || '';
  sessionStorage.setItem('nanobotUser', authUsername);
  var el = document.getElementById('header-user');
  if (authUsername) {
    el.textContent = '👤 ' + authUsername;
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

async function submitAuth() {
  var pw = document.getElementById('auth-password').value;
  var un = document.getElementById('auth-username').value;
  var errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  var body = _isMultiUser ? { username: un, password: pw } : { password: pw };
  try {
    var res = await fetch('/v1/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      var data = await res.json();
      authToken = data.token || '';
      sessionStorage.setItem('nanobotToken', authToken);
      _setAuthUser(data.username || '');
      document.getElementById('auth-overlay').classList.add('hidden');
      init();
    } else {
      errEl.textContent = _isMultiUser ? '用户名或密码错误，请重试' : '密码错误，请重试';
      if (_isMultiUser) {
        document.getElementById('auth-username').select();
      } else {
        document.getElementById('auth-password').select();
      }
    }
  } catch (e) {
    errEl.textContent = '请求失败，请检查网络';
  }
}

document.getElementById('auth-username').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('auth-password').focus();
});
document.getElementById('auth-password').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitAuth();
});

function init() {
  _setAuthUser(authUsername);  // show username in header if already stored
  var s = getSes(activeSessionId);
  s.chatEl.style.display = '';   // make the default session visible
  loadMe();    // learn publish permission for UI gating
  loadSessionList();
  loadModels();
  loadCron();  // populate the ⏰ rail failure badge without opening the tab
  loadHistory(activeSessionId).then(function() { connectSession(activeSessionId); });
}

// ── Model switching ────────────────────────────────────────────────────────
async function loadModels() {
  try {
    var res = await apiFetch('/v1/models');
    if (!res.ok) return;
    var data = await res.json();
    if (!data.models || !data.models.length) return;
    var sel = document.getElementById('model-select');
    sel.innerHTML = '';
    data.models.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.label;
      if (m.id === data.current) opt.selected = true;
      sel.appendChild(opt);
    });
    sel.style.display = '';
  } catch (_) {}
}

async function switchModel() {
  var sel = document.getElementById('model-select');
  var model = sel.value;
  if (!model) return;
  try {
    var res = await apiFetch('/v1/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model }),
    });
    if (res.ok) {
      appendSystem('模型已切换为：' + model);
    } else {
      appendSystem('模型切换失败');
      loadModels();
    }
  } catch (e) {
    appendSystem('模型切换失败：' + (e && e.message ? e.message : e));
    loadModels();
  }
}

// ── Sidebar tabs ───────────────────────────────────────────────────────────
function switchSidebarTab(tab) {
  var tabs = ['sessions', 'files', 'skills', 'reports', 'cron'];
  tabs.forEach(function(t) {
    var panel = document.getElementById('panel-' + t);
    if (panel) panel.classList.toggle('active', t === tab);
  });
  document.querySelectorAll('#rail .rail-item').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  if (tab === 'files') {
    loadFiles(currentFilePath || '');
  } else if (tab === 'skills') {
    loadSkills();
  } else if (tab === 'reports') {
    loadReports();
  } else if (tab === 'cron') {
    loadCron();
  }
}

function toggleSidebar() {
  sidebar.classList.toggle('collapsed');
}

// ── Session list ───────────────────────────────────────────────────────────
async function loadSessionList() {
  try {
    var res = await apiFetch('/v1/sessions');
    if (!res.ok) return;
    var data = await res.json();
    allSessions = (data.sessions || []).filter(function(s) {
      return s.key && s.key.startsWith('web:');
    });
    renderSessionList(allSessions);
  } catch (e) {
    console.error('Failed to load sessions:', e);
  }
}

function filterSessions() {
  var q = document.getElementById('session-filter').value.toLowerCase();
  var filtered = q
    ? allSessions.filter(function(s) { return s.key.toLowerCase().includes(q); })
    : allSessions;
  renderSessionList(filtered);
}

function renderSessionList(sessions) {
  sessionList.innerHTML = '';
  if (sessions.length === 0) {
    sessionList.innerHTML = '<div style="padding:14px;color:#666;font-size:0.8rem;">暂无会话</div>';
    return;
  }
  sessions.forEach(function(s) {
    var sid = s.key.replace('web:', '');
    var sesData = sesStore.get(sid);
    var dotClass = 'ses-dot' + (sesData && sesData.busy ? ' busy' : sesData && sesData.unread ? ' unread' : '');
    var el = document.createElement('div');
    el.className = 'session-item' + (sid === activeSessionId ? ' active' : '');
    el.dataset.sid = sid;
    var updatedAt = s.updated_at ? new Date(s.updated_at).toLocaleString('zh-CN') : '';
    el.innerHTML =
      '<span class="' + dotClass + '"></span>' +
      '<div class="session-item-info" onclick="switchSession(\'' + escapeHtml(sid) + '\')">' +
        '<span class="session-name">' + escapeHtml(sid) + '</span>' +
        '<span class="session-time">' + updatedAt + '</span>' +
      '</div>' +
      ((sesData && sesData.sessionArtifacts && sesData.sessionArtifacts.length)
        ? '<span class="ses-artifact-count">📎' + sesData.sessionArtifacts.length + '</span>' : '') +
      '<div class="session-item-actions">' +
        '<button class="session-action-btn share" title="生成只读分享链接" onclick="shareSession(\'' + escapeHtml(sid) + '\', event)">🔗</button>' +
        '<button class="session-action-btn export" title="导出为 Markdown" onclick="exportSession(\'' + escapeHtml(sid) + '\', event)">↓</button>' +
        '<button class="session-action-btn" title="删除会话" onclick="deleteSession(\'' + escapeHtml(sid) + '\', event)">✕</button>' +
      '</div>';
    sessionList.appendChild(el);
  });
}

function updateSessionDot(sid) {
  var item = sessionList.querySelector('[data-sid="' + escapeAttr(sid) + '"]');
  if (!item) return;
  var dotEl = item.querySelector('.ses-dot');
  if (!dotEl) return;
  var s = sesStore.get(sid);
  dotEl.className = 'ses-dot' + (s && s.busy ? ' busy' : s && s.unread ? ' unread' : '');
}

function switchSession(sid) {
  if (sid === activeSessionId) return;

  // Hide the old session's chat div
  var prevSes = sesStore.get(activeSessionId);
  if (prevSes) {
    prevSes.chatEl.style.display = 'none';
    prevSes.unread = false;
  }

  activeSessionId = sid;
  currentSessionId = sid;
  sessInput.value = sid;

  var s = getSes(sid);
  s.chatEl.style.display = '';
  s.unread = false;

  // Update header WS dot and send button to reflect new session
  dot.className = (s.ws && s.ws.readyState === WebSocket.OPEN) ? 'connected' : '';
  sendBtn.disabled = s.busy;
  renderArtifactsBar();
  renderRefChip();

  // Scroll to bottom of newly visible session
  chat.scrollTop = chat.scrollHeight;

  updateActiveSession();

  // Connect if not already open
  if (!s.ws || s.ws.readyState === WebSocket.CLOSED || s.ws.readyState === WebSocket.CLOSING) {
    if (!s.chatEl.firstChild) {
      loadHistory(sid).then(function() { connectSession(sid); });
    } else {
      connectSession(sid);
    }
  }
}

function createAndSwitch() {
  var sid = sessInput.value.trim();
  if (!sid) return;
  switchSession(sid);
}

function updateActiveSession() {
  document.querySelectorAll('.session-item').forEach(function(el) {
    var nameEl = el.querySelector('.session-name');
    if (nameEl) el.classList.toggle('active', nameEl.textContent === activeSessionId);
  });
}

async function deleteSession(sid, e) {
  e.stopPropagation();
  await apiFetch('/v1/sessions/web:' + encodeURIComponent(sid), { method: 'DELETE' });
  if (sid === activeSessionId) {
    switchSession('default');
  } else {
    var s = sesStore.get(sid);
    if (s) {
      if (s.ws) { s.ws.onclose = null; try { s.ws.close(); } catch(_) {} }
      if (s.chatEl && s.chatEl.parentNode) s.chatEl.parentNode.removeChild(s.chatEl);
      sesStore.delete(sid);
    }
  }
  loadSessionList();
}

async function shareSession(sid, e) {
  e.stopPropagation();
  try {
    var res = await apiFetch('/v1/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: 'web:' + sid }),
    });
    if (!res.ok) { alert('生成分享链接失败'); return; }
    var data = await res.json();
    var fullUrl = location.origin + data.url;
    var copied = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(fullUrl);
        copied = true;
      }
    } catch (_) {}
    window.prompt(
      copied ? '只读分享链接已复制到剪贴板：' : '只读分享链接（手动复制）：',
      fullUrl
    );
  } catch (err) {
    alert('生成分享链接失败：' + (err && err.message ? err.message : err));
  }
}

async function exportSession(sid, e) {
  e.stopPropagation();
  var url = '/v1/sessions/web:' + encodeURIComponent(sid) + '/export?format=md';
  if (authToken) url += '&token=' + encodeURIComponent(authToken);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'session_' + sid + '.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// ── File browser ───────────────────────────────────────────────────────────
function formatSize(bytes) {
  if (bytes === null || bytes === undefined) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

// ── File tree (PyCharm-style, lazy-loaded) ──────────────────────────────────
// currentFilePath = the directory selected as the upload / new-file target.
let fileTreeExpanded = new Set(); // directory paths currently expanded
let fileTreeCache = {};           // dir path -> listing (avoids refetch on toggle)
let _treeSeq = 0;                 // guards against out-of-order async rebuilds

function goWorkspace() {
  fileTreeExpanded.clear();
  fileTreeCache = {};
  currentFilePath = '';
  document.getElementById('files-path-input').value = '';
  rebuildTree();
}

async function fetchDir(path) {
  if (fileTreeCache[path]) return fileTreeCache[path];
  var url = '/v1/files' + (path ? '?path=' + encodeURIComponent(path) : '');
  var res = await apiFetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  fileTreeCache[path] = data;
  return data;
}

// Public entry used across the app: refresh the tree, expanding down to `path`.
async function loadFiles(path) {
  path = path || '';
  fileTreeCache = {}; // force a fresh read (callers use this after writes/uploads)
  if (path) {
    var acc = '';
    path.split('/').filter(Boolean).forEach(function(p) {
      acc += (acc ? '/' : '') + p;
      fileTreeExpanded.add(acc);
    });
  }
  currentFilePath = path;
  document.getElementById('files-path-input').value = path;
  await rebuildTree();
}

async function rebuildTree() {
  var seq = ++_treeSeq;
  var frag = document.createElement('div');
  try {
    await renderDirInto(frag, '', 0, seq);
  } catch (e) {
    if (seq === _treeSeq) renderFilesError('无法加载目录：' + e.message);
    return;
  }
  if (seq !== _treeSeq) return; // a newer rebuild superseded this one
  var list = document.getElementById('files-list');
  list.innerHTML = '';
  list.appendChild(frag);
  updateFilesBreadcrumb();
}

async function renderDirInto(container, dirPath, depth, seq) {
  var data = await fetchDir(dirPath);
  if (seq !== _treeSeq) return;
  var showHidden = document.getElementById('files-hidden-toggle').checked;
  var entries = (data.entries || []).filter(function(e) {
    return showHidden || !e.name.startsWith('.');
  });
  if (depth === 0 && entries.length === 0) {
    var em = document.createElement('div');
    em.style.cssText = 'padding:12px;color:var(--text-dim);font-size:0.78rem;';
    em.textContent = '空目录';
    container.appendChild(em);
    return;
  }
  for (var i = 0; i < entries.length; i++) {
    var entry = entries[i];
    container.appendChild(makeFileRow(entry, depth));
    if (entry.type === 'dir' && fileTreeExpanded.has(entry.path)) {
      await renderDirInto(container, entry.path, depth + 1, seq);
      if (seq !== _treeSeq) return;
    }
  }
}

function makeFileRow(entry, depth) {
  var isDir = entry.type === 'dir';
  var el = document.createElement('div');
  el.className = 'file-item' + (isDir && entry.path === currentFilePath ? ' selected' : '');
  el.style.paddingLeft = (depth * 14 + 10) + 'px';
  var twisty = isDir ? (fileTreeExpanded.has(entry.path) ? '▾' : '▸') : '';
  var icon = isDir ? '📁' : '📄';
  var size = entry.type === 'file' ? formatSize(entry.size) : '';
  el.innerHTML =
    '<span class="file-twisty">' + twisty + '</span>' +
    '<span class="file-icon">' + icon + '</span>' +
    '<span class="file-name">' + escapeHtml(entry.name) + '</span>' +
    '<span class="file-size">' + size + '</span>';
  var p = entry.path, name = entry.name;
  el.onclick = function() { if (isDir) toggleDir(p); else openFile(p, name); };
  return el;
}

// Expand/collapse a directory in place (uses cache, no full refetch).
function toggleDir(path) {
  if (fileTreeExpanded.has(path)) fileTreeExpanded.delete(path);
  else fileTreeExpanded.add(path);
  currentFilePath = path; // also becomes the upload / new-file target
  document.getElementById('files-path-input').value = path;
  rebuildTree();
}

// Open a file (type-aware): fetch text only for editable kinds.
async function openFile(path, name) {
  var kind = fileKind(name || path);
  if (!isEditableKind(kind)) {
    // Binary / preview-by-URL — no text fetch needed
    openFileInEditor(path, null, kind);
    return;
  }
  try {
    var res = await apiFetch('/v1/files?path=' + encodeURIComponent(path));
    if (!res.ok) { appendSystem('打开文件失败：' + path); return; }
    var data = await res.json();
    openFileInEditor(path, (data && data.content) || '', kind);
  } catch (e) {
    appendSystem('打开文件失败：' + e.message);
  }
}

// Show the directory that uploads / new files will be created in.
function updateFilesBreadcrumb() {
  var bc = document.getElementById('files-breadcrumb');
  var label = currentFilePath ? 'workspace/' + currentFilePath : 'workspace';
  bc.innerHTML = '<span title="上传 / 新建文件的目标目录" onclick="goWorkspace()">📁 ' +
                 escapeHtml(label) + '</span>';
}

function renderFilesError(msg) {
  document.getElementById('files-list').innerHTML =
    '<div style="padding:12px;color:#e74c3c;font-size:0.78rem;">' + escapeHtml(msg) + '</div>';
}

// Path input: Enter opens a file or expands the tree down to a directory.
document.getElementById('files-path-input').addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  var path = e.target.value.trim();
  (async function() {
    try {
      var res = await apiFetch('/v1/files' + (path ? '?path=' + encodeURIComponent(path) : ''));
      if (!res.ok) { renderFilesError('无法加载：' + path); return; }
      var data = await res.json();
      if (data.type === 'file') {
        var nm = data.name || path.split('/').pop();
        var kind = fileKind(nm);
        if (isEditableKind(kind)) openFileInEditor(data.path || path, data.content || '', kind);
        else openFileInEditor(data.path || path, null, kind);
        return;
      }
      loadFiles(path);
    } catch (err) {
      renderFilesError('无法加载：' + err.message);
    }
  })();
});

function newFile() {
  var name = prompt('新文件名（在当前目录下）：');
  if (!name) return;
  var path = currentFilePath ? currentFilePath + '/' + name : name;
  openFileInEditor(path, '');
}

// Upload one file to a target directory via the multipart endpoint.
// Returns the saved relative path, or null on failure.
async function uploadOneFile(file, targetDir) {
  var fd = new FormData();
  fd.append('file', file);
  fd.append('path', targetDir || '');
  // Note: don't set Content-Type — the browser sets the multipart boundary.
  var res = await apiFetch('/v1/files/upload', { method: 'POST', body: fd });
  if (!res.ok) return null;
  var data = await res.json();
  return data.path || null;
}

// Sidebar: upload selected files into the directory currently being browsed.
async function uploadFilesToCurrentDir(fileList) {
  var files = Array.from(fileList || []);
  if (!files.length) return;
  appendSystem('上传中… (' + files.length + ' 个文件)');
  var ok = 0;
  for (var i = 0; i < files.length; i++) {
    try {
      var saved = await uploadOneFile(files[i], currentFilePath || '');
      if (saved) ok++;
    } catch (_) {}
  }
  document.getElementById('files-upload-input').value = '';
  appendSystem('已上传 ' + ok + '/' + files.length + ' 个文件到 ' + (currentFilePath || 'workspace'));
  loadFiles(currentFilePath || '');
}

// Chat: upload attachments into uploads/, then reference their paths in the input
// so the agent knows where to read them.
async function uploadChatAttachments(fileList) {
  var files = Array.from(fileList || []);
  if (!files.length) return;
  var btn = document.getElementById('attach-btn');
  btn.disabled = true;
  var paths = [];
  for (var i = 0; i < files.length; i++) {
    try {
      var saved = await uploadOneFile(files[i], 'uploads');
      if (saved) paths.push(saved);
    } catch (_) {}
  }
  document.getElementById('chat-upload-input').value = '';
  btn.disabled = false;
  if (!paths.length) { appendSystem('附件上传失败'); return; }
  // Prepend a reference line to the message input.
  var ref = '附件：' + paths.join('、') + '\n';
  input.value = ref + input.value;
  input.focus();
  input.dispatchEvent(new Event('input'));
}

// ── Skills ─────────────────────────────────────────────────────────────────
// Modal state for the skill currently being viewed/edited.
let currentSkill = { name: null, source: null, editable: false, persisted: false, files: [] };

async function loadSkills() {
  var list = document.getElementById('skills-list');
  list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:0.78rem;">加载中…</div>';
  try {
    var res = await apiFetch('/v1/skills');
    if (!res.ok) { list.innerHTML = '<div style="padding:12px;color:#c0392b;font-size:0.78rem;">加载技能失败</div>'; return; }
    var data = await res.json();
    renderSkills(data.skills || []);
  } catch (e) {
    list.innerHTML = '<div style="padding:12px;color:#c0392b;font-size:0.78rem;">请求失败</div>';
  }
}

function renderSkills(skills) {
  var list = document.getElementById('skills-list');
  list.innerHTML = '';
  if (!skills.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--text-dim);font-size:0.78rem;">暂无技能</div>';
    return;
  }
  skills.forEach(function(s) {
    var el = document.createElement('div');
    el.className = 'skill-item';
    var srcBadge = s.source === 'workspace'
      ? '<span class="skill-badge workspace">自定义</span>'
      : '<span class="skill-badge builtin">内置</span>';
    var alwaysBadge = s.always ? '<span class="skill-badge always">常驻</span>' : '';
    var dot = '<span class="skill-avail-dot' + (s.available ? '' : ' unavailable') +
              '" title="' + (s.available ? '可用' : '依赖未满足') + '"></span>';
    var req = (!s.available && s.requires)
      ? '<div class="skill-item-req">缺少：' + escapeHtml(s.requires) + '</div>' : '';
    el.innerHTML =
      '<div class="skill-item-top">' + dot +
        '<span class="skill-item-name">' + escapeHtml(s.name) + '</span>' +
        alwaysBadge + srcBadge +
      '</div>' +
      '<div class="skill-item-desc">' + escapeHtml(s.description || '') + '</div>' + req;
    var nm = s.name;
    el.onclick = function() { openSkillEditor(nm); };
    list.appendChild(el);
  });
}

// The file currently shown in the editor (relative path within the skill).
let currentSkillFile = null;

async function openSkillEditor(name) {
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(name) + '/files');
    if (!res.ok) { alert('打开技能失败'); return; }
    var data = await res.json();
    currentSkill = { name: data.name, source: data.source, editable: data.editable,
                     persisted: true, files: data.files || [] };
    currentSkillFile = null;
    renderSkillChrome();
    document.getElementById('skill-overlay').classList.remove('hidden');
    var skillMd = currentSkill.files.filter(function(f){ return f.path === 'SKILL.md'; })[0];
    var pick = skillMd || currentSkill.files[0];
    if (pick) {
      await openSkillFile(pick.path);
    } else {
      setSkillContent('（空技能目录）', null, false);
    }
  } catch (e) {
    alert('打开技能失败：' + (e && e.message ? e.message : e));
  }
}

// Render the modal frame (title, badge, hint, file list, buttons) — not content.
function renderSkillChrome() {
  var s = currentSkill;
  document.getElementById('skill-box-title').textContent = s.name;
  var badge = document.getElementById('skill-box-badge');
  badge.textContent = s.source === 'workspace' ? '自定义' : '内置';
  badge.className = s.source === 'workspace' ? 'skill-badge workspace' : 'skill-badge builtin';

  var hint = document.getElementById('skill-box-hint');
  if (!s.editable) {
    hint.textContent = '内置技能为只读。点击「复制到 workspace」生成可编辑的自定义副本（含全部子文件，会覆盖同名内置技能）。';
    hint.classList.remove('hidden');
  } else {
    hint.classList.add('hidden');
  }
  document.getElementById('skill-copy-btn').style.display = s.editable ? 'none' : '';
  document.getElementById('skill-delete-btn').style.display =
    (s.editable && s.source === 'workspace' && s.persisted) ? '' : 'none';
  document.getElementById('skill-newfile-btn').style.display =
    (s.editable && s.persisted) ? '' : 'none';
  renderSkillFileList();
}

function renderSkillFileList() {
  var list = document.getElementById('skill-file-list');
  list.innerHTML = '';
  currentSkill.files.forEach(function(f) {
    var el = document.createElement('div');
    el.className = 'skill-file-item' + (f.path === currentSkillFile ? ' active' : '');
    el.textContent = f.path;
    el.title = f.path;
    var p = f.path;
    el.onclick = function() { openSkillFile(p); };
    list.appendChild(el);
  });
}

// Load text into the editor and reconcile the file highlight + save button.
function setSkillContent(text, path, editable) {
  var ta = document.getElementById('skill-box-content');
  ta.value = text;
  ta.readOnly = !editable;
  currentSkillFile = path;
  document.getElementById('skill-save-btn').style.display = editable ? '' : 'none';
  renderSkillFileList();
}

async function openSkillFile(path) {
  try {
    var url = '/v1/skills/' + encodeURIComponent(currentSkill.name) +
              '/file?path=' + encodeURIComponent(path);
    var res = await apiFetch(url);
    if (!res.ok) { alert('打开文件失败'); return; }
    var data = await res.json();
    if (data.binary) {
      setSkillContent('（二进制文件，无法在此预览：' + path + '）', path, false);
    } else {
      setSkillContent(data.content || '', path, currentSkill.editable);
    }
  } catch (e) {
    alert('打开文件失败：' + (e && e.message ? e.message : e));
  }
}

function closeSkillEditor() {
  document.getElementById('skill-overlay').classList.add('hidden');
  currentSkill = { name: null, source: null, editable: false, persisted: false, files: [] };
  currentSkillFile = null;
}

function newSkill() {
  var name = prompt('新技能名称（字母/数字/-/_，将作为目录名）：');
  if (!name) return;
  if (!/^[a-zA-Z0-9_-]+$/.test(name)) { alert('名称只能包含字母、数字、连字符和下划线'); return; }
  currentSkill = { name: name, source: 'workspace', editable: true,
                   persisted: false, files: [{ path: 'SKILL.md' }] };
  var tpl =
    '---\n' +
    'name: ' + name + '\n' +
    'description: "一句话描述这个技能的用途和触发场景"\n' +
    '---\n\n' +
    '# ' + name + '\n\n' +
    '在这里写下 agent 使用该技能的指引。\n';
  renderSkillChrome();
  setSkillContent(tpl, 'SKILL.md', true);
  document.getElementById('skill-overlay').classList.remove('hidden');
}

// Add a new sub-file to a persisted workspace skill (e.g. scripts/run.sh).
async function newSkillFile() {
  if (!currentSkill.persisted) { alert('请先保存技能后再添加文件'); return; }
  var path = prompt('新文件相对路径（如 scripts/run.sh）：');
  if (!path) return;
  if (path.charAt(0) === '/' || path.indexOf('..') !== -1) { alert('路径不合法'); return; }
  if (currentSkill.files.some(function(f){ return f.path === path; })) { openSkillFile(path); return; }
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name) + '/file', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path, content: '' }),
    });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); alert('创建失败：' + (e.detail || res.status)); return; }
    currentSkill.files.push({ path: path });
    currentSkill.files.sort(function(a, b){ return a.path < b.path ? -1 : (a.path > b.path ? 1 : 0); });
    setSkillContent('', path, true);
  } catch (e) {
    alert('创建失败：' + (e && e.message ? e.message : e));
  }
}

async function saveSkill() {
  if (!currentSkill.name || !currentSkillFile) return;
  var content = document.getElementById('skill-box-content').value;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name) + '/file', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: currentSkillFile, content: content }),
    });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); alert('保存失败：' + (e.detail || res.status)); return; }
    currentSkill.source = 'workspace';
    currentSkill.editable = true;
    currentSkill.persisted = true;
    if (!currentSkill.files.some(function(f){ return f.path === currentSkillFile; })) {
      currentSkill.files.push({ path: currentSkillFile });
    }
    appendSystem('已保存：' + currentSkill.name + ' / ' + currentSkillFile);
    renderSkillChrome();
    loadSkills();
  } catch (e) {
    alert('保存失败：' + (e && e.message ? e.message : e));
  }
}

async function deleteSkill() {
  if (!currentSkill.name) return;
  if (!confirm('删除自定义技能「' + currentSkill.name + '」（含全部子文件）？若存在同名内置技能将恢复显示。')) return;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(currentSkill.name), { method: 'DELETE' });
    if (!res.ok) { alert('删除失败'); return; }
    appendSystem('技能已删除：' + currentSkill.name);
    closeSkillEditor();
    loadSkills();
  } catch (e) {
    alert('删除失败：' + (e && e.message ? e.message : e));
  }
}

// Copy a read-only builtin skill (all files) into the workspace for editing.
async function copySkillToWorkspace() {
  var name = currentSkill.name;
  if (!name) return;
  try {
    var res = await apiFetch('/v1/skills/' + encodeURIComponent(name) + '/copy', { method: 'POST' });
    if (!res.ok) { var e = await res.json().catch(function(){return {};}); alert('复制失败：' + (e.detail || res.status)); return; }
    appendSystem('已复制到 workspace（含全部子文件）：' + name);
    await openSkillEditor(name);
    loadSkills();
  } catch (e) {
    alert('复制失败：' + (e && e.message ? e.message : e));
  }
}

// ── Editor Panel ───────────────────────────────────────────────────────────
function openEditorPanel() {
  var panel = document.getElementById('editor-panel');
  panel.classList.add('open');
  document.getElementById('resizer-right').style.display = 'block';
  // Restore saved editor width
  try {
    var ew = localStorage.getItem('perrobot.editorW');
    if (ew) panel.style.width = ew;
  } catch (_) {}
}

function closeEditorPanel() {
  document.getElementById('editor-panel').classList.remove('open');
  document.getElementById('resizer-right').style.display = 'none';
}

function openFileInEditor(path, content, kind) {
  kind = kind || fileKind(path);
  if (!editorFiles.has(path)) {
    editorFiles.set(path, {
      content: content, originalContent: content, dirty: false, kind: kind
    });
  } else {
    var existing = editorFiles.get(path);
    existing.kind = kind;
    if (!existing.dirty) {
      existing.content = content;
      existing.originalContent = content;
    }
  }
  editorActiveTab = path;
  // Binary / preview-only kinds force view mode
  if (!isEditableKind(kind)) editorMode = 'view';
  openEditorPanel();
  renderEditorTabs();
  syncEditorToolbar();
  renderEditorContent();
}

function renderEditorTabs() {
  var tabsEl = document.getElementById('editor-tabs');
  tabsEl.innerHTML = '';
  editorFiles.forEach(function(state, path) {
    var tab = document.createElement('div');
    tab.className = 'editor-tab' + (path === editorActiveTab ? ' active' : '');
    var filename = path.split('/').pop();
    tab.innerHTML =
      '<span class="editor-tab-name" title="' + escapeAttr(path) + '">' + escapeHtml(filename) + '</span>' +
      (state.dirty ? '<span class="editor-tab-dirty">●</span>' : '') +
      '<button class="editor-tab-close" onclick="closeEditorTab(\'' + escapeAttr(path) + '\', event)" title="关闭">×</button>';
    var tabPath = path;
    tab.onclick = function(e) {
      if (e.target.classList.contains('editor-tab-close')) return;
      switchEditorTab(tabPath);
    };
    tabsEl.appendChild(tab);
  });
}

function switchEditorTab(path) {
  // Save current textarea content before switching
  saveCurrentTabContent();
  editorActiveTab = path;
  var state = editorFiles.get(path);
  if (state && !isEditableKind(state.kind)) editorMode = 'view';
  renderEditorTabs();
  syncEditorToolbar();
  renderEditorContent();
}

function saveCurrentTabContent() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;
  if (editorMode === 'edit' && isEditableKind(state.kind)) {
    var ta = document.getElementById('editor-textarea');
    state.content = ta.value;
    state.dirty = state.content !== state.originalContent;
  }
}

// Enable/disable toolbar buttons based on the active file's kind.
function syncEditorToolbar() {
  var state = editorActiveTab ? editorFiles.get(editorActiveTab) : null;
  var editable = state && isEditableKind(state.kind);
  var editBtn = document.getElementById('editor-edit-btn');
  var saveBtn = document.getElementById('editor-save-btn');
  editBtn.style.display = editable ? '' : 'none';
  saveBtn.style.display = editable ? '' : 'none';
}

function closeEditorTab(path, e) {
  e.stopPropagation();
  var state = editorFiles.get(path);
  if (state && state.dirty) {
    if (!confirm('文件 "' + path.split('/').pop() + '" 有未保存的更改，确定关闭？')) return;
  }
  editorFiles.delete(path);
  if (editorActiveTab === path) {
    var keys = Array.from(editorFiles.keys());
    editorActiveTab = keys.length > 0 ? keys[keys.length - 1] : null;
  }
  if (!editorActiveTab) {
    closeEditorPanel();
  } else {
    renderEditorTabs();
    renderEditorContent();
  }
}

function renderEditorContent() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;

  var path = editorActiveTab;
  var kind = state.kind || 'text';
  var content = state.content || '';

  // Status bar
  var statPath = document.getElementById('editor-stat-path');
  var statLines = document.getElementById('editor-stat-lines');
  var statBytes = document.getElementById('editor-stat-bytes');
  statPath.textContent = path;
  if (isEditableKind(kind)) {
    var bytes = new TextEncoder().encode(content).length;
    statLines.textContent = content.split('\n').length + ' 行';
    statBytes.textContent = formatSize(bytes);
  } else {
    statLines.textContent = kind.toUpperCase();
    statBytes.textContent = '';
  }

  var viewArea = document.getElementById('editor-view-area');
  var editArea = document.getElementById('editor-edit-area');

  // Edit mode: only for editable kinds
  if (editorMode === 'edit' && isEditableKind(kind)) {
    viewArea.style.display = 'none';
    editArea.style.display = 'flex';
    document.getElementById('editor-textarea').value = content;
    return;
  }

  // View mode (rich preview)
  editArea.style.display = 'none';
  viewArea.style.display = 'block';
  viewArea.innerHTML = '';

  if (kind === 'image') {
    viewArea.innerHTML = '<div class="preview-image-wrap"><img src="' +
      escapeAttr(downloadUrl(path)) + '" alt="' + escapeAttr(path) + '"></div>';
    return;
  }
  if (kind === 'pdf') {
    viewArea.innerHTML = '<iframe class="preview-frame" src="' +
      escapeAttr(downloadUrl(path)) + '"></iframe>';
    return;
  }
  if (kind === 'docx') {
    renderDocxPreview(path, viewArea);
    return;
  }
  if (kind === 'binary') {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📦</div>' +
      '<div>此文件类型暂不支持预览</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
    return;
  }
  if (kind === 'md') {
    var html = (typeof marked !== 'undefined')
      ? marked.parse(content) : ('<pre>' + escapeHtml(content) + '</pre>');
    viewArea.innerHTML = '<div class="preview-doc">' + html + '</div>';
    return;
  }
  if (kind === 'html') {
    var frame = document.createElement('iframe');
    frame.className = 'preview-frame';
    frame.setAttribute('sandbox', 'allow-same-origin');
    frame.srcdoc = content;
    viewArea.appendChild(frame);
    return;
  }

  // Default: code / plain text with syntax highlight
  var pre = document.createElement('pre');
  var code = document.createElement('code');
  code.textContent = content;
  var ext = (path.split('.').pop() || '').toLowerCase();
  if (CODE_LANGS[ext]) code.className = 'language-' + CODE_LANGS[ext];
  pre.appendChild(code);
  viewArea.appendChild(pre);
  // Highlight defensively — never let a highlighter error break the editor
  if (typeof hljs !== 'undefined') {
    try { hljs.highlightElement(code); } catch (_) {}
  }
}

// Render a .docx file by fetching its bytes and converting with mammoth.
async function renderDocxPreview(path, viewArea) {
  viewArea.innerHTML = '<div class="preview-loading">正在解析 Word 文档…</div>';
  if (typeof mammoth === 'undefined') {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📄</div>' +
      '<div>Word 预览组件未加载</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
    return;
  }
  try {
    var res = await apiFetch(downloadUrl(path));
    if (!res.ok) throw new Error('下载失败');
    var buf = await res.arrayBuffer();
    var result = await mammoth.convertToHtml({ arrayBuffer: buf });
    // Guard against stale tab switches
    if (editorActiveTab !== path) return;
    viewArea.innerHTML = '<div class="preview-doc">' +
      (result.value || '<p>(空文档)</p>') + '</div>';
  } catch (e) {
    viewArea.innerHTML =
      '<div class="preview-fallback"><div class="pf-icon">📄</div>' +
      '<div>无法预览此 Word 文档</div>' +
      '<button onclick="downloadCurrentFile()">↓ 下载到本地</button></div>';
  }
}

function setEditorMode(mode) {
  saveCurrentTabContent();
  // Binary / preview-only files can't be edited
  var state = editorActiveTab ? editorFiles.get(editorActiveTab) : null;
  if (mode === 'edit' && state && !isEditableKind(state.kind)) return;
  editorMode = mode;
  document.getElementById('editor-view-btn').classList.toggle('active', mode === 'view');
  document.getElementById('editor-edit-btn').classList.toggle('active', mode === 'edit');
  renderEditorContent();
}

async function saveCurrentFile() {
  saveCurrentTabContent();
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;

  try {
    var res = await apiFetch('/v1/files', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: editorActiveTab, content: state.content }),
    });
    if (res.ok) {
      state.originalContent = state.content;
      state.dirty = false;
      renderEditorTabs();
      appendSystem('文件已保存：' + editorActiveTab);
    } else {
      var err = await res.json();
      alert('保存失败：' + (err.detail || res.status));
    }
  } catch (e) {
    alert('保存失败：' + e.message);
  }
}

function downloadCurrentFile() {
  if (!editorActiveTab) return;
  var url = '/v1/files/download?path=' + encodeURIComponent(editorActiveTab);
  if (authToken) url += '&token=' + encodeURIComponent(authToken);
  window.open(url, '_blank');
}

// Track textarea changes for dirty detection
document.getElementById('editor-textarea').addEventListener('input', function() {
  if (!editorActiveTab) return;
  var state = editorFiles.get(editorActiveTab);
  if (!state) return;
  state.content = this.value;
  state.dirty = state.content !== state.originalContent;
  // Update dirty indicator on tab without full re-render
  var tabs = document.querySelectorAll('.editor-tab');
  var keys = Array.from(editorFiles.keys());
  var idx = keys.indexOf(editorActiveTab);
  if (idx >= 0 && tabs[idx]) {
    var dirtyEl = tabs[idx].querySelector('.editor-tab-dirty');
    if (state.dirty && !dirtyEl) {
      var nameEl = tabs[idx].querySelector('.editor-tab-name');
      var span = document.createElement('span');
      span.className = 'editor-tab-dirty';
      span.textContent = '●';
      nameEl.after(span);
    } else if (!state.dirty && dirtyEl) {
      dirtyEl.remove();
    }
  }
});

// Ctrl+S to save
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    var editorPanelEl = document.getElementById('editor-panel');
    if (editorPanelEl.classList.contains('open')) {
      e.preventDefault();
      saveCurrentFile();
    }
  }
});

// ── History loading ────────────────────────────────────────────────────────
async function loadHistory(sid) {
  try {
    var res = await apiFetch('/v1/sessions/web:' + encodeURIComponent(sid) + '/messages');
    if (!res.ok) return;
    var data = await res.json();
    var messages = data.messages || [];
    if (messages.length === 0) return;

    var chatEl = getSes(sid).chatEl;
    var divider = document.createElement('div');
    divider.className = 'history-divider';
    divider.textContent = '── 历史记录 (' + messages.length + ' 条) ──';
    chatEl.appendChild(divider);

    var histPaths = [];
    messages.forEach(function(m) {
      var el = document.createElement('div');
      if (m.role === 'user') {
        el.className = 'msg user';
        el.style.opacity = '0.85';
        el.innerHTML = '<div class="avatar">👤</div><div class="bubble">' +
          escapeHtml(m.content).replace(/\n/g, '<br>') + '</div>';
        chatEl.appendChild(el);
      } else if (m.role === 'assistant') {
        el.className = 'msg bot';
        el.style.opacity = '0.85';
        el.innerHTML = '<div class="avatar">🐕</div><div class="bubble">' +
          renderMarkdown(m.content) + '</div>';
        chatEl.appendChild(el);
        enhanceBubble(el.querySelector('.bubble'));
        // Rebuild session artifacts from mentioned file paths (survives reload)
        extractFilePathsFromText(m.content || '').forEach(function(p) { histPaths.push(p); });
      }
    });
    addSessionArtifacts(sid, histPaths);

    var endDivider = document.createElement('div');
    endDivider.className = 'history-divider';
    endDivider.textContent = '── 历史记录结束 ──';
    chatEl.appendChild(endDivider);
    if (sid === activeSessionId) chat.scrollTop = chat.scrollHeight;
  } catch (e) {
    console.error('Failed to load history:', e);
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function connectSession(sid) {
  var s = getSes(sid);
  if (s.ws && (s.ws.readyState === WebSocket.CONNECTING || s.ws.readyState === WebSocket.OPEN)) return;

  var wsInst = new WebSocket(wsUrl(sid));
  s.ws = wsInst;

  wsInst.onopen = function() {
    if (s.ws !== wsInst) return; // superseded by a newer connection
    if (sid === activeSessionId) dot.className = 'connected';
    updateSessionDot(sid);
    var sysEl = document.createElement('div');
    sysEl.className = 'history-divider';
    sysEl.textContent = 'i 已连接到会话「' + sid + '」';
    s.chatEl.appendChild(sysEl);
    if (sid === activeSessionId) chat.scrollTop = chat.scrollHeight;
    loadSessionList();
  };

  wsInst.onclose = function() {
    if (s.ws !== wsInst) return;
    if (sid === activeSessionId) { dot.className = ''; sendBtn.disabled = false; }
    // Finalize any in-progress stream for this session
    if (s.streamBubbleEl) {
      s.streamBubbleEl.classList.remove('streaming');
      s.streamBubbleEl.innerHTML = renderMarkdown(s.streamBuffer);
      enhanceBubble(s.streamBubbleEl);
      s.streamBubbleEl = null; s._streamTextNode = null; s.streamBuffer = '';
      s.streamRateEl = null; s.streamTokenCount = 0; s.streamStartTime = 0;
    }
    s.busy = false;
    updateSessionDot(sid);
    var sysEl = document.createElement('div');
    sysEl.className = 'history-divider';
    sysEl.textContent = 'i 连接断开，5 秒后重连…';
    s.chatEl.appendChild(sysEl);
    if (sid === activeSessionId) chat.scrollTop = chat.scrollHeight;
    setTimeout(function() { connectSession(sid); }, 5000);
  };

  wsInst.onerror = function() { wsInst.close(); };

  wsInst.onmessage = function(e) {
    var msg; try { msg = JSON.parse(e.data); } catch(_) { return; }
    routeMessage(sid, msg);
  };
}

function routeMessage(sid, msg) {
  var prevSid = currentSessionId;
  currentSessionId = sid;
  var s = getSes(sid);
  var isBackground = (sid !== activeSessionId);

  if (msg.type === 'token') {
    removeTyping(); streamToken(msg.content);
  } else if (msg.type === 'token_cancel') {
    streamCancel();
  } else if (msg.type === 'progress') {
    removeTyping(); appendStep(msg.content, false);
  } else if (msg.type === 'tool') {
    removeTyping(); appendStep(msg.content, true);
  } else if (msg.type === 'skill') {
    removeTyping(); appendSkillUsed(msg.content);
  } else if (msg.type === 'approval_request') {
    removeTyping(); appendApprovalRequest(msg.id, msg.command, msg.reason);
  } else if (msg.type === 'file_written') {
    s.filesWrittenThisTurn.push(msg.content);
  } else if (msg.type === 'message') {
    removeTyping();
    collapseCurrentSteps();
    if (!streamFinalize(msg.content)) appendBot(msg.content);
    var turnPaths = mergeFilePaths(msg.content || '', s.filesWrittenThisTurn);
    appendFileChips(turnPaths);
    addSessionArtifacts(sid, turnPaths);
    s.filesWrittenThisTurn = [];
    setBusy(false);
    if (isBackground) { s.unread = true; updateSessionDot(sid); }
    loadSessionList();
  } else if (msg.type === 'push') {
    removeTyping(); collapseCurrentSteps(); streamCancel();
    appendPush(msg.content);
    setBusy(false);
  }

  currentSessionId = prevSid;
}

// ── Send ───────────────────────────────────────────────────────────────────
function sendMessage() {
  var text = input.value.trim();
  var s = getSes(activeSessionId);
  if (!text || s.busy || !s.ws || s.ws.readyState !== WebSocket.OPEN) return;
  appendUser(text);
  var payload = text;
  if (s.referencedReport) {
    var r = s.referencedReport;
    var hint = '[引用报告文件：' + r.path;
    if (r.snapshot) {
      hint += '（同目录快照文件 ' + r.snapshot + ' 含底层数据，优先读取快照复用，避免重新查询日志库）';
    }
    hint += '。请先阅读该报告' + (r.snapshot ? '及其快照' : '') + '，再据此回答以下问题。]\n\n';
    payload = hint + text;
  }
  s.ws.send(JSON.stringify({ content: payload }));
  input.value = '';
  input.style.height = '';
  s.currentStepsGroup = null;
  s.stepsCounter = 0;
  s.toolsUsed = [];
  s.skillsUsed = [];
  s.filesWrittenThisTurn = [];
  s.streamBubbleEl = null;
  s.streamBuffer = '';
  showTyping();
  setBusy(true);
}

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
input.addEventListener('input', function() {
  input.style.height = '';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// ── Session clear ──────────────────────────────────────────────────────────
async function clearSession() {

  var s = getSes(sid);

  s.sessionArtifacts = []; renderArtifactsBar();
  s.referencedReport = null; renderRefChip();

}

// ── Helpers ────────────────────────────────────────────────────────────────
function setBusy(v) {
  getSes(currentSessionId).busy = v;
  if (currentSessionId === activeSessionId) sendBtn.disabled = v;
  updateSessionDot(currentSessionId);
}

function scrollBottom() {
  if (currentSessionId === activeSessionId) chat.scrollTop = chat.scrollHeight;
}

function renderMarkdown(md) {
  if (typeof marked === 'undefined') return escapeHtml(md || '');
  return marked.parse(md || '');
}

// Post-process a rendered bubble: render mermaid diagrams + highlight code.
function enhanceBubble(bubbleEl) {
  if (!bubbleEl) return;
  // 1) Mermaid: ```mermaid blocks → rendered SVG
  var mermaidBlocks = bubbleEl.querySelectorAll('pre > code.language-mermaid');
  mermaidBlocks.forEach(function (code) {
    var pre = code.parentElement;
    var src = code.textContent || '';
    var holder = document.createElement('div');
    holder.className = 'mermaid';
    pre.replaceWith(holder);
    if (typeof mermaid === 'undefined') { holder.textContent = src; return; }
    var id = 'mmd-' + (++_mermaidSeq);
    try {
      mermaid.render(id, src).then(function (res) {
        holder.innerHTML = res.svg;
      }).catch(function (e) {
        holder.className = 'mermaid-error';
        holder.textContent = '图表渲染失败：' + (e && e.message ? e.message : e) + '\n\n' + src;
      });
    } catch (e) {
      holder.className = 'mermaid-error';
      holder.textContent = '图表渲染失败：' + (e && e.message ? e.message : e) + '\n\n' + src;
    }
  });
  // 2) Syntax-highlight remaining code blocks
  if (typeof hljs !== 'undefined') {
    bubbleEl.querySelectorAll('pre > code:not(.language-mermaid)').forEach(function (code) {
      try { hljs.highlightElement(code); } catch (_) {}
    });
  }
}

function appendUser(text, isHistory) {
  var el = document.createElement('div');
  el.className = 'msg user';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML =
    '<div class="avatar">👤</div>' +
    '<div class="bubble">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>';
  chatAppend(el);
  if (!isHistory) scrollBottom();
}

function appendBot(text, isHistory) {
  var el = document.createElement('div');
  el.className = 'msg bot';
  if (isHistory) el.style.opacity = '0.85';
  el.innerHTML =
    '<div class="avatar">🐕</div>' +
    '<div class="bubble">' + renderMarkdown(text) + '</div>';
  chatAppend(el);
  enhanceBubble(el.querySelector('.bubble'));
  if (!isHistory) scrollBottom();
}

function appendPush(text) {
  var el = document.createElement('div');
  el.className = 'msg push';
  el.innerHTML =
    '<div class="avatar">🔔</div>' +
    '<div class="bubble"><strong>系统通知</strong><br>' + renderMarkdown(text) + '</div>';
  chatAppend(el);
  enhanceBubble(el.querySelector('.bubble'));
  scrollBottom();
}

// ── Streaming bubble ───────────────────────────────────────────────────────
function streamToken(delta) {
  var s = getSes(currentSessionId);
  if (!s.streamBubbleEl) {
    var wrapper = document.createElement('div');
    wrapper.className = 'msg bot';
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = '🐕';
    var bubble = document.createElement('div');
    bubble.className = 'bubble streaming';
    // Dedicated text node keeps text separate from the rate div
    var textNode = document.createTextNode('');
    var rateEl = document.createElement('div');
    rateEl.className = 'stream-rate';
    bubble.appendChild(textNode);
    bubble.appendChild(rateEl);
    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    chatAppend(wrapper);
    s.streamBubbleEl = bubble;
    s._streamTextNode = textNode;
    s.streamRateEl = rateEl;
    s.streamBuffer = '';
    s.streamTokenCount = 0;
    s.streamStartTime = Date.now();
  }
  s.streamBuffer += delta;
  s.streamTokenCount++;
  s._streamTextNode.textContent = s.streamBuffer;
  // Refresh rate every 5 tokens
  if (s.streamTokenCount % 5 === 0) {
    var elapsed = (Date.now() - s.streamStartTime) / 1000;
    if (elapsed > 0.2) {
      s.streamRateEl.textContent = Math.round(s.streamTokenCount / elapsed) + ' tok/s';
    }
  }
  scrollBottom();
}

function streamCancel() {
  var s = getSes(currentSessionId);
  if (s.streamBubbleEl) {
    var msgEl = s.streamBubbleEl.closest('.msg');
    if (msgEl) msgEl.remove();
  }
  s.streamBubbleEl = null; s._streamTextNode = null;
  s.streamBuffer = '';
  s.streamRateEl = null;
  s.streamTokenCount = 0; s.streamStartTime = 0;
}

function streamFinalize(finalText) {
  var s = getSes(currentSessionId);
  if (!s.streamBubbleEl) return false;
  s.streamBubbleEl.classList.remove('streaming');
  s.streamBubbleEl.innerHTML = renderMarkdown(finalText != null ? finalText : s.streamBuffer);
  enhanceBubble(s.streamBubbleEl);
  s.streamBubbleEl = null; s._streamTextNode = null;
  s.streamBuffer = '';
  s.streamRateEl = null;
  s.streamTokenCount = 0; s.streamStartTime = 0;
  scrollBottom();
  return true;
}

// ── Approval requests ──────────────────────────────────────────────────────
function appendApprovalRequest(id, command, reason) {
  collapseCurrentSteps();
  var el = document.createElement('div');
  el.className = 'approval-card';
  el.id = 'approval-' + id;
  el.innerHTML =
    '<div class="approval-head">⚠️ 需要你确认一个高危操作</div>' +
    '<div class="approval-reason">' + escapeHtml(reason || '') + '</div>' +
    '<pre class="approval-cmd">' + escapeHtml(command || '') + '</pre>' +
    '<div class="approval-actions">' +
      '<button class="btn danger" onclick="respondApproval(\'' + escapeAttr(id) + '\', false)">拒绝</button>' +
      '<button class="btn" onclick="respondApproval(\'' + escapeAttr(id) + '\', true)">批准执行</button>' +
    '</div>';
  chatAppend(el);
  scrollBottom();
}

function respondApproval(id, approved) {
  var activeSes = getSes(activeSessionId);
  if (activeSes.ws && activeSes.ws.readyState === WebSocket.OPEN) {
    activeSes.ws.send(JSON.stringify({ type: 'approval_response', id: id, approved: approved }));
  }
  var card = document.getElementById('approval-' + id);
  if (card) {
    var actions = card.querySelector('.approval-actions');
    if (actions) actions.innerHTML =
      '<span class="approval-result ' + (approved ? 'ok' : 'no') + '">' +
      (approved ? '✓ 已批准' : '✕ 已拒绝') + '</span>';
    card.classList.add(approved ? 'approved' : 'denied');
  }
  if (!approved) showTyping();  // agent will adapt; keep the busy indicator alive
}

function appendSystem(text) {
  var el = document.createElement('div');
  el.className = 'history-divider';
  el.textContent = 'i ' + text;
  chatAppend(el);
  scrollBottom();
}

// ── Collapsible steps ──────────────────────────────────────────────────────
function ensureStepsGroup() {
  var s = getSes(currentSessionId);
  if (s.currentStepsGroup) return s.currentStepsGroup;

  var group = document.createElement('div');
  group.className = 'steps-group running';

  var toggle = document.createElement('button');
  toggle.className = 'steps-toggle';
  toggle.innerHTML =
    '<span class="arrow">▼</span>' +
    '<span class="step-summary">思考中…</span>' +
    '<span class="tool-chips"></span>';
  toggle.onclick = function() { group.classList.toggle('collapsed'); };

  var content = document.createElement('div');
  content.className = 'steps-content';

  group.appendChild(toggle);
  group.appendChild(content);
  chatAppend(group);
  s.currentStepsGroup = group;
  s.stepsCounter = 0;
  return group;
}

function extractToolName(text) {
  var m = text.match(/^([a-zA-Z_][a-zA-Z0-9_]*)\s*[(\s"']?/);
  return m ? m[1] : text.split(/[\s("]/)[0];
}

function updateToggleChips(group) {
  var s = getSes(currentSessionId);
  var chipsEl = group.querySelector('.tool-chips');
  chipsEl.innerHTML = '';
  s.skillsUsed.forEach(function(name) {
    var chip = document.createElement('span');
    chip.className = 'skill-chip';
    chip.textContent = '✦ ' + name;
    chipsEl.appendChild(chip);
  });
  s.toolsUsed.forEach(function(name) {
    var chip = document.createElement('span');
    chip.className = 'tool-chip';
    chip.textContent = name;
    chipsEl.appendChild(chip);
  });
}

function appendSkillUsed(skillName) {
  var s = getSes(currentSessionId);
  if (!s.skillsUsed.includes(skillName)) s.skillsUsed.push(skillName);
  var group = ensureStepsGroup();
  updateToggleChips(group);
}

function appendStep(text, isTool) {
  var s = getSes(currentSessionId);
  var group = ensureStepsGroup();
  var content = group.querySelector('.steps-content');

  var el = document.createElement('div');
  el.className = 'step-item ' + (isTool ? 'tool' : 'progress');
  el.textContent = isTool ? ('⚙ ' + text) : ('💭 ' + text.slice(0, 400));
  content.appendChild(el);
  s.stepsCounter++;

  if (isTool) {
    var toolName = extractToolName(text);
    if (toolName && !s.toolsUsed.includes(toolName)) s.toolsUsed.push(toolName);
    updateToggleChips(group);
  }

  var summary = group.querySelector('.step-summary');
  summary.textContent = '思考中… (' + s.stepsCounter + ' 步)';
  content.style.maxHeight = (content.scrollHeight + 40) + 'px';
  scrollBottom();
}

function finalizeCurrentSteps() {
  var s = getSes(currentSessionId);
  if (!s.currentStepsGroup) return;
  var group = s.currentStepsGroup;
  group.classList.remove('running');

  var summary = group.querySelector('.step-summary');
  var parts = [];
  if (s.skillsUsed.length) parts.push(s.skillsUsed.length + ' 个技能');
  if (s.toolsUsed.length) parts.push(s.toolsUsed.length + ' 个工具');
  var toolLabel = parts.length ? '使用了 ' + parts.join(' · ') : '纯推理';
  summary.textContent = '✅ 完成 · ' + s.stepsCounter + ' 步 · ' + toolLabel;

  s.currentStepsGroup = null;
  s.stepsCounter = 0;
  s.toolsUsed = [];
  s.skillsUsed = [];
}

function collapseCurrentSteps() {
  finalizeCurrentSteps();
}

// Extract backtick-quoted file paths from the bot message text.
// Agent always mentions the important output files; this is more reliable
// than tracking every write_file call (which includes intermediate scripts).
function extractFilePathsFromText(text) {
  var result = [], seen = new Set();
  // Match `path/to/file.ext` or `filename.ext` — relative, with an extension.
  var re = /`([a-zA-Z0-9_.\-\/]+\.[a-zA-Z0-9]{1,8})`/g, m;
  while ((m = re.exec(text)) !== null) {
    var p = m[1];
    if (!p.startsWith('/') && p.length < 150 && !seen.has(p)) {
      seen.add(p); result.push(p);
    }
  }
  return result;
}

// Merge: message-mentioned paths first, then any write_file paths not already present.
function mergeFilePaths(messageText, writtenPaths) {
  var seen = new Set(), out = [];
  extractFilePathsFromText(messageText).forEach(function(p) {
    if (!seen.has(p)) { seen.add(p); out.push(p); }
  });
  writtenPaths.forEach(function(p) {
    if (!seen.has(p)) { seen.add(p); out.push(p); }
  });
  return out;
}

// Render clickable file chips below the most-recent bot response.
function appendFileChips(paths) {
  if (!paths.length) return;
  var row = document.createElement('div');
  row.className = 'file-chips-row';
  paths.forEach(function(p) {
    var chip = document.createElement('span');
    chip.className = 'file-chip';
    chip.title = p;
    var name = p.split('/').pop();
    chip.innerHTML = '📄 ' + escapeHtml(name);
    chip.onclick = function() {
      openFile(p, name);
      if (document.getElementById('panel-files').classList.contains('active')) return;
      switchSidebarTab('files');
    };
    row.appendChild(chip);
  });
  chatAppend(row);
  scrollBottom();
}

// ── Session artifacts (files produced across the whole session) ──────────────
var _RESULT_EXTS = ['md','markdown','docx','doc','pdf','csv','xlsx','xls','pptx','ppt','html'];
function isResultDoc(path) {
  var name = path.split('/').pop();
  if (name.charAt(0) === '_' || name.charAt(0) === '.') return false;  // hidden / temp
  var ext = name.indexOf('.') >= 0 ? name.split('.').pop().toLowerCase() : '';
  return _RESULT_EXTS.indexOf(ext) >= 0;
}
function artifactMeta(path) {
  var name = path.split('/').pop();
  var ext = name.indexOf('.') >= 0 ? name.split('.').pop().toLowerCase() : '';
  if (['md','markdown'].indexOf(ext) >= 0) return { ic: '📊', tag: '报告', tagCls: 'rep' };
  if (['csv','xlsx','xls'].indexOf(ext) >= 0) return { ic: '📈', tag: '数据', tagCls: 'data' };
  if (['docx','doc','pdf','pptx','ppt'].indexOf(ext) >= 0) return { ic: '📄', tag: '文档', tagCls: 'rep' };
  if (['py'].indexOf(ext) >= 0) return { ic: '🐍', tag: '', tagCls: '' };
  if (['json'].indexOf(ext) >= 0) return { ic: '📦', tag: '', tagCls: '' };
  return { ic: '📄', tag: '', tagCls: '' };
}
function addSessionArtifacts(sid, paths) {
  if (!paths || !paths.length) return;
  var s = getSes(sid);
  var seen = {};
  s.sessionArtifacts.forEach(function(a) { seen[a.path] = true; });
  paths.forEach(function(p) {
    if (!p || seen[p]) return;
    seen[p] = true;
    s.sessionArtifacts.push({ path: p, name: p.split('/').pop() });
  });
  if (sid === activeSessionId) renderArtifactsBar();
  updateSessionArtifactCount(sid);
}
function renderArtifactsBar() {
  var bar = document.getElementById('chat-artifacts-bar');
  var s = getSes(activeSessionId);
  var n = s.sessionArtifacts.length;
  document.getElementById('art-count').textContent = n;
  bar.classList.toggle('show', n > 0);
  if (n === 0) document.getElementById('art-pop').classList.remove('show');
}
function toggleArtifactsPop(e) {
  if (e) e.stopPropagation();
  var pop = document.getElementById('art-pop');
  if (pop.classList.contains('show')) { pop.classList.remove('show'); return; }
  renderArtifactsPop();
  pop.classList.add('show');
}
function renderArtifactsPop() {
  var pop = document.getElementById('art-pop');
  var items = getSes(activeSessionId).sessionArtifacts;
  var results = items.filter(function(a) { return isResultDoc(a.path); });
  var process = items.filter(function(a) { return !isResultDoc(a.path); });
  var html = '<div class="ap-head"><span>本会话产出（' + items.length + '）</span>' +
    '<span class="all" onclick="switchSidebarTab(\'files\');toggleArtifactsPop(event)">全部文件 ↗</span></div>';
  function rows(list) {
    return list.map(function(a) {
      var m = artifactMeta(a.path);
      var tag = m.tag ? '<span class="tag ' + m.tagCls + '">' + m.tag + '</span>' : '';
      return '<div class="ap-item" onclick="openArtifact(\'' + escapeAttr(a.path) + '\')">' +
        '<span class="ic">' + m.ic + '</span><span class="nm" title="' + escapeAttr(a.path) + '">' +
        escapeHtml(a.name) + '</span>' + tag + '</div>';
    }).join('');
  }
  if (results.length) html += '<div class="ap-grp">📌 结果文档 · ' + results.length + '</div>' + rows(results);
  if (process.length) html += '<div class="ap-sec muted"><div class="ap-grp">⚙️ 过程文件 · ' + process.length + '</div>' + rows(process) + '</div>';
  if (!items.length) html += '<div class="ap-empty">本会话还没有产出文件</div>';
  pop.innerHTML = html;
}
function openArtifact(path) {
  openFile(path, path.split('/').pop());
  document.getElementById('art-pop').classList.remove('show');
}
function updateSessionArtifactCount(sid) {
  var item = sessionList.querySelector('[data-sid="' + escapeAttr(sid) + '"]');
  if (!item) return;
  var s = sesStore.get(sid);
  var n = s ? s.sessionArtifacts.length : 0;
  var badge = item.querySelector('.ses-artifact-count');
  if (n > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'ses-artifact-count';
      var info = item.querySelector('.session-item-info');
      if (info) info.parentNode.insertBefore(badge, info.nextSibling);
    }
    badge.textContent = '📎' + n;
  } else if (badge) {
    badge.remove();
  }
}
// Close the artifacts popover when clicking elsewhere
document.addEventListener('click', function(e) {
  var bar = document.getElementById('chat-artifacts-bar');
  if (bar && !bar.contains(e.target)) {
    var pop = document.getElementById('art-pop');
    if (pop) pop.classList.remove('show');
  }
});

// ── Reports ──────────────────────────────────────────────────────────────────
var _allReports = [], _shownReports = [], _canPublish = true;
async function loadMe() {
  try {
    var res = await apiFetch('/v1/me');
    if (res.ok) { var d = await res.json(); _canPublish = !!d.can_publish; }
  } catch (e) {}
}
async function loadReports() {
  try {
    var res = await apiFetch('/v1/reports');
    if (!res.ok) return;
    var data = await res.json();
    _allReports = data.reports || [];
    renderReports();
  } catch (e) { console.error('loadReports', e); }
}
function renderReports() {
  var list = document.getElementById('reports-list');
  if (!list) return;
  var q = (document.getElementById('reports-search').value || '').toLowerCase();
  var items = _allReports.filter(function(r) {
    return !q || (r.title + ' ' + r.name + ' ' + r.path).toLowerCase().indexOf(q) >= 0;
  });
  _shownReports = [];
  if (!items.length) {
    list.innerHTML = '<div style="padding:14px;color:var(--text-faint);font-size:0.8rem;line-height:1.6;">' +
      (q ? '无匹配报告' : '暂无报告<br>可在对话中生成，或点 ↥ 上传线下报告') + '</div>';
    return;
  }
  function grp(title, arr) {
    if (!arr.length) return '';
    var h = '<div class="report-grp">' + title + ' · ' + arr.length + '</div>';
    arr.forEach(function(r) {
      var i = _shownReports.length; _shownReports.push(r);
      var badge = r.status === 'published'
        ? '<span class="report-badge pub">已发布</span>'
        : '<span class="report-badge draft">草稿</span>';
      var author = r.author ? escapeHtml(r.author) : (r.status === 'published' ? '团队' : '我');
      var snap = r.snapshot ? '<span class="report-snap">📎快照</span>' : '';
      var acts = '<div class="report-actions">' +
        '<button class="ref" onclick="referenceReportIdx(' + i + ',event)">📎 引用追问</button>' +
        (r.status === 'draft' && _canPublish ? '<button onclick="publishReportIdx(' + i + ',event)">发布</button>' : '') +
        '</div>';
      h += '<div class="report-item" onclick="openReportIdx(' + i + ')">' +
        '<div class="report-title" title="' + escapeAttr(r.title) + '">' + escapeHtml(r.title) + '</div>' +
        '<div class="report-meta">' + badge + author + snap + '</div>' + acts + '</div>';
    });
    return h;
  }
  list.innerHTML =
    grp('团队看板 · 已发布', items.filter(function(r) { return r.status === 'published'; })) +
    grp('我的草稿', items.filter(function(r) { return r.status === 'draft'; }));
}
function openReportIdx(i) { var r = _shownReports[i]; if (r) openReport(r.path, r.name); }
async function openReport(path, name) {
  // Published reports live in the shared board (outside the user workspace),
  // so read via the reports-content endpoint rather than /v1/files.
  try {
    var res = await apiFetch('/v1/reports/content?path=' + encodeURIComponent(path));
    if (res.ok) { var d = await res.json(); openFileInEditor(path, d.content || '', 'markdown'); return; }
  } catch (e) {}
  openFile(path, name);  // fallback
}
function referenceReportIdx(i, e) {
  if (e) e.stopPropagation();
  var r = _shownReports[i]; if (!r) return;
  referenceReport(r.path, r.title, r.snapshot);
}
function publishReportIdx(i, e) {
  if (e) e.stopPropagation();
  var r = _shownReports[i]; if (r) publishReport(r.path, r.title);
}
function referenceReport(path, name, snapshot) {
  var s = getSes(activeSessionId);
  s.referencedReport = { path: path, name: name, snapshot: snapshot || null };
  renderRefChip();
  appendSystem('已引用报告「' + name + '」' + (snapshot ? '（含数据快照）' : '') + '，可在下方直接追问');
  input.focus();
}
function clearRef() {
  getSes(activeSessionId).referencedReport = null;
  renderRefChip();
}
function renderRefChip() {
  var bar = document.getElementById('ref-bar');
  var r = getSes(activeSessionId).referencedReport;
  if (r) {
    bar.style.display = '';
    bar.innerHTML = '<span class="picked">📎 已引用报告：<b>' + escapeHtml(r.name) + '</b>' +
      (r.snapshot ? ' · 复用快照' : '') + '<span class="rx" onclick="clearRef()">✕</span></span>';
  } else {
    bar.style.display = 'none';
    bar.innerHTML = '';
  }
}
async function publishReport(path, title) {
  if (!confirm('发布「' + title + '」到团队看板？\n\n发布后全员可见，请确认不含敏感原文（用户隐私、密钥等）。')) return;
  try {
    var res = await apiFetch('/v1/reports/publish', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: path }),
    });
    if (res.ok) { appendSystem('报告「' + title + '」已发布到团队看板'); loadReports(); }
    else if (res.status === 403) appendSystem('发布失败：你没有发布权限');
    else appendSystem('发布失败');
  } catch (e) { appendSystem('发布失败：' + (e && e.message ? e.message : e)); }
}
async function uploadReports(fileList) {
  var files = Array.from(fileList || []);
  if (!files.length) return;
  appendSystem('上传报告中… (' + files.length + ' 个文件)');
  var ok = 0;
  for (var i = 0; i < files.length; i++) {
    try { if (await uploadOneFile(files[i], 'reports')) ok++; } catch (_) {}
  }
  document.getElementById('reports-upload-input').value = '';
  appendSystem('已上传 ' + ok + ' 个文件到 reports/（草稿）');
  loadReports();
}

// ── Cron / scheduled tasks ───────────────────────────────────────────────────
var _cronJobs = [], _cronShown = [];
function fmtTs(ms) { if (!ms) return '—'; try { return new Date(ms).toLocaleString('zh-CN'); } catch (e) { return '—'; } }
function cronExprText(expr) {
  var p = (expr || '').split(/\s+/); if (p.length < 5) return expr || '—';
  var mm = p[0], hh = p[1], dom = p[2], mon = p[3], dow = p[4];
  var pad = function(x) { return x.length < 2 ? '0' + x : x; };
  var t = pad(hh) + ':' + pad(mm);
  var W = ['日', '一', '二', '三', '四', '五', '六'];
  if (dom === '*' && mon === '*' && dow === '*') return '每天 ' + t;
  if (dom === '*' && mon === '*' && dow !== '*') return '每周' + (W[+dow] || dow) + ' ' + t;
  if (dom !== '*' && mon === '*' && dow === '*') return '每月 ' + dom + ' 号 ' + t;
  return expr;
}
function cronScheduleText(job) {
  var s = job.schedule || {};
  if (s.kind === 'every' && s.every_ms) return '每 ' + Math.round(s.every_ms / 60000) + ' 分钟';
  if (s.kind === 'cron' && s.expr) return cronExprText(s.expr);
  if (s.kind === 'at') return '单次';
  return s.expr || '—';
}
async function loadCron() {
  try {
    var res = await apiFetch('/v1/cron'); if (!res.ok) return;
    var data = await res.json(); _cronJobs = data.jobs || [];
    renderCron(); updateCronBadge();
  } catch (e) { console.error('loadCron', e); }
}
function renderCron() {
  var list = document.getElementById('cron-list'); if (!list) return;
  _cronShown = _cronJobs.slice();
  if (!_cronShown.length) {
    list.innerHTML = '<div style="padding:14px;color:var(--text-faint);font-size:0.8rem;line-height:1.6;">暂无定时任务<br>点“+ 新建”创建一个</div>';
    return;
  }
  list.innerHTML = _cronShown.map(function(j, i) {
    var st = !j.enabled ? 'off' : (j.last_status === 'error' ? 'fail' : 'ok');
    var sub = !j.enabled ? '已暂停'
      : (j.last_status === 'error' ? '<span style="color:var(--danger)">上次失败</span>' : cronScheduleText(j));
    return '<div class="cron-item" onclick="openCronDetail(' + i + ')">' +
      '<div class="cron-name">' + escapeHtml(j.name) + '</div>' +
      '<div class="cron-sub"><span class="cron-st ' + st + '"></span>' + sub + '</div></div>';
  }).join('');
}
function updateCronBadge() {
  var btn = document.querySelector('#rail .rail-item[data-tab="cron"]'); if (!btn) return;
  var hasFail = _cronJobs.some(function(j) { return j.enabled && j.last_status === 'error'; });
  var badge = btn.querySelector('.rail-badge');
  if (hasFail && !badge) { badge = document.createElement('span'); badge.className = 'rail-badge'; btn.appendChild(badge); }
  else if (!hasFail && badge) { badge.remove(); }
}
function openCronDetail(i) {
  var j = _cronShown[i]; if (!j) return;
  document.getElementById('cron-d-title').textContent = j.name;
  var fail = j.last_status === 'error'
    ? '<div class="mb-warn">⚠️ 上次运行失败：' + escapeHtml(j.last_error || '未知错误') + '</div>' : '';
  var body = fail +
    '<div class="mb-field"><div class="k">做什么</div><div>' + escapeHtml(j.message) + '</div></div>' +
    '<div class="mb-field"><div class="k">频率</div><div>' + cronScheduleText(j) +
      (j.schedule && j.schedule.expr ? ' <span class="mb-note">(' + escapeHtml(j.schedule.expr) + ')</span>' : '') + '</div></div>' +
    '<div class="mb-field"><div class="k">状态</div><div>' + (j.enabled ? '启用' : '已暂停') + ' · 上次 ' + (j.last_status || '未运行') + '</div></div>' +
    '<div class="mb-field"><div class="k">下次运行</div><div>' + fmtTs(j.next_run_at_ms) + '</div></div>' +
    '<div class="mb-field"><div class="k">上次运行</div><div>' + fmtTs(j.last_run_at_ms) + '</div></div>' +
    '<div class="mb-acts">' +
      '<button class="btn danger" onclick="deleteCron(\'' + j.id + '\')">删除</button>' +
      '<div style="flex:1"></div>' +
      '<button class="btn secondary" onclick="toggleCron(\'' + j.id + '\',' + (!j.enabled) + ')">' + (j.enabled ? '暂停' : '启用') + '</button>' +
      '<button class="btn" onclick="runCronNow(\'' + j.id + '\')">▶ 立即运行</button>' +
    '</div>';
  document.getElementById('cron-d-body').innerHTML = body;
  document.getElementById('cron-detail-overlay').classList.add('show');
}
function closeCronDetail() { document.getElementById('cron-detail-overlay').classList.remove('show'); }
async function runCronNow(id) {
  closeCronDetail(); appendSystem('正在运行定时任务…');
  try {
    var res = await apiFetch('/v1/cron/' + encodeURIComponent(id) + '/run', { method: 'POST' });
    appendSystem(res.ok ? '定时任务已触发运行' : '运行失败');

async function toggleCron(id, enabled) {
  try {

async function deleteCron(id) {
